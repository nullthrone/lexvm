name: Content pack proposal
description: Propose a new adventure (content pack) before you write or generate it.
title: "Pack: "
labels: ["content-pack", "area: content"]
body:
  - type: markdown
    attributes:
      value: |
        A proposal lets others give early feedback on the idea, scope and license before you
        invest time. Read the content guidelines in CONTRIBUTING.md and the authoring guide
        (docs/authoring/guide.md) first.

  - type: input
    id: title
    attributes:
      label: Working title
      placeholder: "Nebel über Altona"
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language
      description: The language of all player-facing text. LexVM currently supports German and English.
      options:
        - German (de)
        - English (en)
        - Other (needs engine support, describe below)
    validations:
      required: true

  - type: input
    id: genre
    attributes:
      label: Genre
      placeholder: "Noir mystery, comedy, ghost story, science fiction, ..."
    validations:
      required: true

  - type: dropdown
    id: length
    attributes:
      label: Planned length
      options:
        - Short (up to 15 minutes)
        - Medium (15 to 45 minutes)
        - Long (45 to 90 minutes)
        - Very long (more than 90 minutes)
    validations:
      required: true

  - type: textarea
    id: premise
    attributes:
      label: Premise
      description: Setting, the player's role and the goal, in a few sentences. Spoilers are fine.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Rough number of rooms, characters and puzzles; puzzle ideas you already have.

  - type: textarea
    id: themes
    attributes:
      label: Sensitive themes and historical context
      description: |
        Violence, crime, war, persecution or other mature themes, and how the pack handles them.
        For historical settings: period, place and sources you rely on.

  - type: dropdown
    id: license
    attributes:
      label: Content license
      description: The SPDX license the pack will declare. CC-BY-4.0 is recommended (see ADR 0010).
      options:
        - CC-BY-4.0 (recommended)
        - CC-BY-SA-4.0
        - CC0-1.0
        - Other (name the SPDX id below)
    validations:
      required: true

  - type: dropdown
    id: llm
    attributes:
      label: Will you generate the pack with an LLM?
      options:
        - No, written by hand
        - Partly, LLM-assisted writing with substantial human editing
        - Mostly generated by an LLM, reviewed and edited by me
    validations:
      required: true

  - type: dropdown
    id: pipeline
    attributes:
      label: Which pipeline?
      options:
        - Not applicable (written by hand)
        - Prompt kit in the player or prompts/ (copy and paste)
        - lexvm generate (CLI with the Anthropic API)
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: provenance
    attributes:
      label: Provenance details
      description: |
        How you will write, generate and edit the pack, and anything else reviewers should know.
        This will go into the pack's `author` and `generator` fields.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The pack will follow the content guidelines in CONTRIBUTING.md (no hateful content, no sexual content involving minors, no real private individuals, respectful handling of historical settings).
          required: true
        - label: The content will be original or properly licensed; it does not copy text, characters or settings from copyrighted works.
          required: true
        - label: I will disclose LLM involvement honestly in the pack's `author` and `generator` fields.
          required: true
        - label: The pack will pass `lexvm check` with no errors before I open a pull request.
          required: true
