# yaml-language-server: $schema=../../schema/lexvm-pack-1.schema.json
#
# Die letzte Nacht der Reichsmark: a noir crime story in Hamburg on the night
# before the currency reform (19 June 1948). The design lives in design/; ids
# there are the ids of the pack. This file holds the metadata, verbs, flags,
# counters, endings, hints and the walkthrough. Rooms, objects, rules and
# dialogues are in the other YAML files of this directory.
format: lexvm-pack/1
id: letzte-nacht-der-reichsmark
version: 1.2.0
title: Die letzte Nacht der Reichsmark
subtitle: Ein Hamburger Kriminalfall, Juni 1948
description: "Hamburg, 19. Juni 1948: Morgen wird die Reichsmark zu Altpapier, und der Hafenarbeiter Jakob Brodersen ist verschwunden – angeblich mit gestohlenen Zigaretten. Ein Noir-Krimi aus Indizien und Verhören über Schwarzmarkt, Persilscheine und Schuld."
language: de
author: LexVM contributors
license: CC-BY-4.0
policy: forgiving
generator:
  pipeline: "LexVM staged design pipeline (three proposals, lead-designer synthesis, staged writing, automated verification, blind playtests)"
  notes: "Written with an LLM and reviewed by the maintainers. All persons, firms, ships and places in the plot are fictional."
playtime: 65
# Story first: about 60% of the play time is reading (spec section 17, design/story.md).
pacing: narrative
maxScore: 25

start:
  room: detektei
  intro: |-
    Hamburg, Sonnabend, 19. Juni 1948. Es regnet seit Tagen, und seit gestern Abend weiß es die ganze Stadt aus dem Radio: Am Sonntag gibt es neues Geld, vierzig Mark pro Kopf. Was du in Reichsmark besitzt, ist ab morgen kaum noch das Papier wert, auf dem es gedruckt ist. Die Leute sind seit dem Morgen unterwegs, um ihre Schulden zu bezahlen, solange das alte Geld noch etwas gilt.

    Du gehörst nicht zu ihnen. Bis zum Sommer dreiundvierzig hast du für eine Seeversicherung Ladungen geprüft, dann brannte das Haus der Versicherung mitsamt den Akten, und seitdem nimmst du Fälle an, die sonst keiner will: verschwundene Männer, verschwundene Waren, manchmal beides.

    Heute Abend sitzt eine Frau auf deinem Besucherstuhl. Sie trägt einen umgefärbten Wehrmachtsmantel und hält ihre Handtasche fest, als könnte jemand sie ihr wegnehmen. Sie hat noch nichts gesagt. Sie wartet, bis du sie ansprichst.

# Documents are read with look: the parser maps »lies« to it, because the
# pack has no verb of its own for reading (playtest round 1, CHANGES.md).
verbs:
  use:
    label: Benutzen
    # »angle mit dem Bootshaken nach dem Klemmbrett«, »halte X gegen Y«
    synonyms: [angle, angel, angeln, fische, fisch, halte, halt]
    default: Das bringt dich nicht weiter.
  bezahlen:
    label: Bezahlen
    synonyms: [bezahle, bezahl, zahle, zahl, zahlen, kaufe, kauf, kaufen, bestich, besteche, bestechen, spendiere, spendier]
    default: Hier will keiner dein Geld.
  zaehlen:
    label: Zählen
    synonyms: [zähle, zähl, nachzählen]
    default: Du zählst, wie Jakob. Die Zahl bleibt dieselbe.
  horchen:
    label: Horchen
    synonyms: [horche, horch, lausche, lausch, lauschen]
    default: Nur der Regen.
  helfen:
    label: Helfen
    synonyms: [hilf, helfe, trage, trag, tragen, stütze, stütz, stützen]
    default: Allein schaffst du das nicht.

# Every flag and counter of the pack, including those only dialogues set or read.
flags:
  auftrag_angenommen: false # node an_bezahlung (dialogue anni_auftrag)
  hintertuer_frei: false # rules give_reichsmark_wirt, bezahlen_*
  asmussen_getroffen: false # rule asmussen_hinterhalt
  tadeusz_rudert: false # option t_ueberfahrt (dialogue tadeusz_gespraech)
  laterne_an: false # rule laterne_anzuenden
  kroeger_zeuge: false # option k_g_zeuge (dialogue kroeger_verhoer)
  # Names the player knows (ADR 0013): set where the name falls. Kröger's
  # name variant uses clue_kroeger_version, learned when he introduces himself.
  kennt_anni: false # node an_start (dialogue anni_auftrag)
  kennt_lene: false # node l_hub, node l_redet, rules show_paeckchen_lene, show_los_lene
  kennt_tadeusz: false # node t_hub (dialogue tadeusz_gespraech)

counters:
  kroeger_stufe: 0 # interrogation stage 0–4, set only by options of kroeger_verhoer

endings:
  ende_erster_morgen:
    title: Der erste Morgen
    win: true
    text:
      - when: { flag: kroeger_zeuge }
        text: |-
          Um halb sechs stehen zwei Jeeps der Militärpolizei am Kehrwieder. Ein Captain lässt die Kisten auf dem vierten Stock nachzählen, zweimal, weil er es nicht glauben will, und schreibt dann ›Lot 4471 – complete‹ in sein Buch. Asmussen steigt ohne Mantel in den Wagen. Vor einem britischen Gericht zählen seine Persilscheine nicht, und das scheint er erst zu begreifen, als die Tür zuschlägt.

          Jakob tragen sie auf einer ausgehängten Tür hinunter zum Boot. »Zweihundert«, sagt er zu jedem, der fragt, und zu einigen, die nicht fragen. Tadeusz rudert, dann sagt er aus, langsam und in ganzen Sätzen. Weggesehen hat er lange genug.

          Kröger redet drei Stunden lang, ohne Köm. Er erzählt von der Luke, vom Arzt, den er holen wollte, und von dem Mann, der Nein gesagt hat. Er bekommt zwei Jahre, und du sagst für ihn aus, wie versprochen.

          Sonntagmorgen. Anni und Lotte stehen in der Schlange vor der Kartenstelle, und der Regen hat endlich aufgehört. Anni legt drei Lebensmittelkarten auf den Tisch und hundertzwanzig Reichsmark: vierzig für jeden Kopf, auch für den, der noch im Krankenhaus liegt. Am Montag sind die Schaufenster voll, als hätte jemand sie über Nacht gefüllt. Hat ja auch jemand.
