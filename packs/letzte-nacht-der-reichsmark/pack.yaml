          Kommissar Petersen kommt selbst, unrasiert, im nassen Mantel. Derselbe Mann, der Jakob am Freitag einen Dieb genannt hat. Er sieht die Kisten an, dann dich, und schreibt lange. Asmussen bittet um ein Telefon. Sein Anwalt ist schon unterwegs, und mit ihm drei neue Persilscheine.

          Kröger ist am Morgen fort, und mit ihm der beste Zeuge. Von da an kommt jeden Monat ein Kuvert ohne Absender in die Siedlung, Hütte 14. Jakob tragen sie auf einer Tür zum Boot. »Zweihundert«, sagt er zu jedem, der fragt.

          Sonntagmorgen. Anni und Lotte stehen in der Schlange vor der Kartenstelle. Anni legt drei Lebensmittelkarten auf den Tisch und hundertzwanzig Reichsmark: vierzig für jeden Kopf. Am Montag sind die Schaufenster voll, als hätte jemand sie über Nacht gefüllt. Hat ja auch jemand.

# In solving order: the first hint whose `until` does not hold is shown.
hints:
  - id: h_auftrag
    until: { flag: auftrag_angenommen }
    steps:
      - Die Frau in deinem Besucherstuhl ist deine Klientin.
      - Sprich mit Anni Brodersen.
      - Tippe Anni an, wähle »Sprechen« und hör ihr bis zum Ende zu.
  - id: h_aushang
    until: { has: clue_loeschliste }
    steps:
      - Im Kaischuppen hängt etwas am Tor.
      - Der Aushang verrät, was Donnerstagnacht gelöscht wurde.
      - Lies den Aushang im Kaischuppen.
  - id: h_spind
    until: { has: clue_zweitschluessel }
    steps:
      - Anni hat dir Jakobs Spindschlüssel gegeben.
      - Kaischuppen 17 liegt südlich vom Baumwall. Such dort Spind 23.
      - Geh nach Süden in den Kaischuppen und öffne Spind 23.
  - id: h_paeckchen
    until: { has: clue_los4471 }
    steps:
      - Die Polizei hat zwei Stangen gefunden. Hat sie alles gefunden?
      - Sieh dir den offenen Spind genau an.
      - Nimm das Zigarettenpäckchen aus Spind 23.
  - id: h_frisch
    until: { has: clue_frisch_an_land }
    steps:
      - Losnummern verraten das Schiff. Wann kam dieses Los an Land?
      - Vergleiche das Päckchen mit der Löschliste.
      - Benutze im Notizbuch »Los 4471« mit »Löschliste: 200 Kisten«.
  - id: h_nur_kroeger
    until: { has: clue_nur_kroeger }
    steps:
      - Wer konnte Spind 23 seit Donnerstag öffnen?
      - Jakobs Schlüssel hing zu Hause. Und der zweite?
      - Benutze im Notizbuch »Der vergessene Schlüssel« mit »Zweitschlüssel«.
  - id: h_untergeschoben
    until: { has: clue_untergeschoben }
    steps:
      - Du weißt jetzt, wann die Ware an Land kam und wer seitdem an den Spind konnte.
      - Zusammen beweisen die beiden Schlüsse etwas über Jakob.
      - Benutze im Notizbuch »Frisch an Land« mit »Nur Krögers Schlüssel«.
  - id: h_kroeger_version
    until: { has: clue_kroeger_version }
    steps:
      - Jakobs Vorarbeiter heißt Kröger. Er trinkt in St. Pauli.
      - Westlich vom Baumwall liegt die Kneipe »Zum Letzten Groschen«.
      - Geh in die Kneipe und sprich mit Kröger.
  - id: h_tadeusz
    until: { has: clue_zaehlheft }
    steps:
      - Anni hat einen Freund von Jakob erwähnt.
      - Tadeusz am Zollkanal redet erst, wenn er sicher ist, dass Jakob kein Dieb ist.
      - "Sprich am Zollkanal mit Tadeusz: »Jakob ist kein Dieb. Ich kann es beweisen.«"
  - id: h_tally
    until: { has: clue_tally }
    steps:
      - Im Kaischuppen hängt hinter Glas, was Kröger gezählt hat.
      - Durch den Spalt reicht dein Arm nicht. Am Zollkanal liegen Boote – und was man an Booten so braucht.
      - Nimm den Bootshaken am Zollkanal und benutze ihn im Kaischuppen mit dem Klemmbrett.
  - id: h_zwanzig
    until: { has: clue_zwanzig_kisten }
    steps:
      - Zweihundert laut Löschliste. Und laut Kröger?
      - Leg die beiden Zahlen nebeneinander.
      - Benutze im Notizbuch »Tallyzettel: 180 Kisten« mit »Löschliste: 200 Kisten«.
  - id: h_hintertuer
    until: { flag: hintertuer_frei }
    steps:
      - Hinter der Kneipe wird gehandelt. Der Wirt lässt nur zahlende Kundschaft durch.
      - Lies die Kreidetafel. Wer will heute noch Reichsmark?
      - Gib dem Wirt die Reichsmark.
  - id: h_lene
    until: { has: clue_lene }
    steps:
      - Lene sagt, sie raucht nicht. Ihr Bauchladen sagt etwas anderes.
      - Zeig ihr, was du aus Jakobs Spind hast.
      - Zeig Lene das Zigarettenpäckchen.
  - id: h_kein_schwund
    until: { has: clue_kein_schwund }
    steps:
      - "Kröger sagt: Was fehlt, ist Schwund."
      - Zwanzig Kisten fehlen – und Lene kauft genau dieses Los von Kröger.
      - Benutze im Notizbuch »Zwanzig Kisten fehlen« mit »Lenes Aussage«.
  - id: h_anni
    until: { has: clue_schweigegeld }
    steps:
      - Lene hat Kröger mit einem Kuvert bei den Brodersens gesehen.
      - Davon hat Anni dir nichts erzählt. Frag sie in ihrer Hütte.
      - Fahr mit der Straßenbahn zur Siedlung, sprich mit Anni und frag nach Krögers Kuvert.
  - id: h_verhoer
    until: { has: clue_gestaendnis }
    steps:
      - Kröger hat vier Behauptungen. Für jede brauchst du den einen Beweis, der sie widerlegt. Lies »Krögers Version«.
      - Schwund → »Kein Schwund«. Mitternacht → »Jakobs Zählheft«. Dieb → »Untergeschoben«. Brodersens → »Zweihundert Reichsmark«.
      - Sprich mit Kröger, wähle »Reden wir über Donnerstagnacht« und leg die Beweise in dieser Reihenfolge vor.
  - id: h_ueberfahrt
    until: { flag: tadeusz_rudert }
    steps:
      - Jakob ist in Speicher K. Die Zollbrücke ist nachts zu.
      - Kröger hat gesagt, wessen Boot er nimmt.
      - "Sprich am Zollkanal mit Tadeusz: »Jakob lebt. Speicher K, vierter Boden.«"
  - id: h_laterne
    until: { flag: laterne_an }
    steps:
      - Im Treppenhaus ist es fast dunkel.
      - Auf dem Absatz steht eine Sturmlaterne. Du hast Streichhölzer.
      - Benutze die Streichhölzer mit der Sturmlaterne.
  - id: h_bodentuer
    until: { isOpen: bodentuer }
    steps:
      - Kröger hat dir einen Schlüssel gegeben.
      - Mit Licht findest du auch das Schloss.
      - Öffne die Bodentür und geh hinauf.
  - id: h_jakob
    until: { has: clue_jakob_aussage }
    steps:
      - Der Mann am Pfeiler ist Jakob.
      - Er ist wach. Sprich mit ihm.
      - Sprich mit Jakob und frag, was passiert ist.
  - id: h_anweisung
    until: { has: clue_anweisung }
    steps:
      - Unter der Wasserkanne klemmt Papier.
      - Kröger hat seine Anweisung hier liegen lassen.
      - Lies den Zettel.
  - id: h_hand
    until: { has: clue_dieselbe_hand }
    steps:
      - Grüne Tinte. Wo hast du die schon einmal gesehen?
      - Vergleiche die Anweisung mit Krögers Persilschein.
      - Benutze im Notizbuch »Die Anweisung« mit »Krögers Persilschein«.
  - id: h_finale
    # Asmussen never returns to nowhere after the ambush, so this hint stays until the end.
    until: { in: { object: asmussen, location: nowhere } }
    steps:
      - Asmussen hat für jede Behauptung eine Ausrede. Auf jede passt genau ein Beweis.
      - "»Kenne ich kaum« → Persilschein. »Hinter meinem Rücken« → Dieselbe Hand. »Leben gerettet« → Jakobs Aussage."
      - Sprich mit Asmussen, leg Persilschein, Dieselbe Hand und Jakobs Aussage vor, lehn sein Angebot ab und entscheide.

