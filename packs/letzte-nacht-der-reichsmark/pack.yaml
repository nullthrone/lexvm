# yaml-language-server: $schema=../../schema/lexvm-pack-1.schema.json
#
# Die letzte Nacht der Reichsmark: a noir crime story in Hamburg on the night
# before the currency reform (19 June 1948). The design lives in design/; ids
# there are the ids of the pack. This file holds the metadata, verbs, flags,
# counters, endings, hints and the walkthrough. Rooms, objects, rules and
# dialogues are in the other YAML files of this directory.
format: lexvm-pack/1
id: letzte-nacht-der-reichsmark
version: 1.0.0
title: Die letzte Nacht der Reichsmark
subtitle: Ein Hamburger Kriminalfall, Juni 1948
description: "Hamburg, 19. Juni 1948: Morgen wird die Reichsmark zu Altpapier, und der Schauermann Jakob Brodersen ist verschwunden – angeblich mit gestohlenen Zigaretten. Ein Noir-Krimi aus Indizien und Verhören über Schwarzmarkt, Persilscheine und Schuld."
language: de
author: LexVM contributors
license: CC-BY-4.0
policy: forgiving
generator:
  pipeline: "LexVM staged design pipeline (three proposals, lead-designer synthesis, staged writing, automated verification, blind playtests)"
  notes: "Written with an LLM and reviewed by the maintainers. All persons, firms, ships and places in the plot are fictional."
playtime: 40
maxScore: 25

start:
  room: detektei
  intro: |-
    Hamburg, Sonnabend, 19. Juni 1948. Es regnet seit Tagen. Seit gestern Abend weiß es die ganze Stadt aus dem Radio: Am Sonntag gibt es neues Geld. Vierzig Mark pro Kopf. Was du in Reichsmark besitzt, ist ab morgen kaum noch das Papier wert.

    In deinem Besucherstuhl sitzt eine Frau in einem umgefärbten Wehrmachtsmantel und hält ihre Handtasche fest, als könnte jemand sie ihr wegnehmen.

verbs:
  lesen:
    label: Lesen
    synonyms: [lies, lese, lesen]
    default: Da gibt es nichts zu lesen.
  use:
    label: Benutzen
    default: Das bringt dich nicht weiter.

# Every flag and counter of the pack, including those only dialogues set or read.
flags:
  auftrag_angenommen: false # node an_bezahlung (dialogue anni_auftrag)
  hintertuer_frei: false # rule give_reichsmark_wirt
  asmussen_getroffen: false # rule asmussen_hinterhalt
  tadeusz_rudert: false # option t_ueberfahrt (dialogue tadeusz_gespraech)
  laterne_an: false # rule laterne_anzuenden
  kroeger_zeuge: false # option k_g_zeuge (dialogue kroeger_verhoer)

counters:
  kroeger_stufe: 0 # interrogation stage 0–4, set only by options of kroeger_verhoer

endings:
  ende_erster_morgen:
    title: Der erste Morgen
    win: true
    text:
      - when: { flag: kroeger_zeuge }
        text: |-
          Um halb sechs stehen zwei Jeeps der Militärpolizei am Kehrwieder. Ein Captain zählt die Kisten nach und schreibt ›Lot 4471 – complete‹. Asmussen steigt ohne Mantel in den Wagen. Vor einem britischen Gericht zählen seine Persilscheine nicht.

          Kröger sagt aus, drei Stunden lang, ohne Köm. Er bekommt zwei Jahre. Jakob tragen sie auf einer Tür zum Boot. »Zweihundert«, sagt er zu jedem, der fragt.

          Sonntagmorgen. Anni und Lotte stehen in der Schlange vor der Kartenstelle. Anni legt drei Lebensmittelkarten auf den Tisch und hundertzwanzig Reichsmark: vierzig für jeden Kopf. Am Montag sind die Schaufenster voll, als hätte jemand sie über Nacht gefüllt. Hat ja auch jemand.
      - text: |-
          Um halb sechs stehen zwei Jeeps der Militärpolizei am Kehrwieder. Ein Captain zählt die Kisten nach und schreibt ›Lot 4471 – complete‹. Asmussen steigt ohne Mantel in den Wagen. Vor einem britischen Gericht zählen seine Persilscheine nicht.

          Kröger ist am Morgen fort, nach Harburg, heißt es. Von da an kommt jeden Monat ein Kuvert ohne Absender in die Siedlung, Hütte 14. Jakob tragen sie auf einer Tür zum Boot. »Zweihundert«, sagt er zu jedem, der fragt.

          Sonntagmorgen. Anni und Lotte stehen in der Schlange vor der Kartenstelle. Anni legt drei Lebensmittelkarten auf den Tisch und hundertzwanzig Reichsmark: vierzig für jeden Kopf. Am Montag sind die Schaufenster voll, als hätte jemand sie über Nacht gefüllt. Hat ja auch jemand.
  ende_hamburger_regen:
    title: Hamburger Regen
    win: true
    text:
      - when: { flag: kroeger_zeuge }
        text: |-
          Kommissar Petersen kommt selbst, unrasiert, im nassen Mantel. Derselbe Mann, der Jakob am Freitag einen Dieb genannt hat. Er sieht die Kisten an, dann dich, und schreibt lange. Asmussen bittet um ein Telefon. Sein Anwalt ist schon unterwegs, und mit ihm drei neue Persilscheine.

          Aber Kröger hat unterschrieben, und diesmal zählt seine Unterschrift. Jakob tragen sie auf einer Tür zum Boot. »Zweihundert«, sagt er zu jedem, der fragt.

          Sonntagmorgen. Anni und Lotte stehen in der Schlange vor der Kartenstelle. Anni legt drei Lebensmittelkarten auf den Tisch und hundertzwanzig Reichsmark: vierzig für jeden Kopf. Am Montag sind die Schaufenster voll, als hätte jemand sie über Nacht gefüllt. Hat ja auch jemand.
