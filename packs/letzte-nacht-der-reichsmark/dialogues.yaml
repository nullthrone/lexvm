# yaml-language-server: $schema=../../schema/lexvm-pack-1.schema.json
#
# Dialogues of »Die letzte Nacht der Reichsmark«. Design: design/cast.md
# (dialogue plans), design/puzzles.md (walkthrough, score), design/style.md
# (voices), design/story.md (scenes and turning points). Option ids are
# unique across the whole pack. No option uses `once`: options that must
# disappear are gated on the clue they teach. A side question whose answer
# closes the topic ends the conversation instead of asking for a
# »Verstehe.« tap; talking again reopens the hub.

dialogues:
  # -------------------------------------------------------------------------
  # Act I: the intro. Linear, cannot be left half-way.
  # Started by rule talk_anni_auftrag while auftrag_angenommen is false.
  # It also teaches the notebook: combining two entries draws a conclusion.
  # -------------------------------------------------------------------------
  anni_auftrag:
    with: anni
    start: an_start
    nodes:
      an_start:
        say: "Die Frau sieht dich an, als müsste sie erst entscheiden, ob du es wert bist. Dann sagt sie es, ohne Umweg: »Mein Mann ist weg. Jakob Brodersen, Hafenarbeiter. Seit Donnerstagnacht.« Sie sagt es wie eine Adresse, die sie in den letzten zwei Tagen zu oft aufschreiben musste. »Ich heiße Anni. Die Polizei sucht ihn auch. Nur aus einem anderen Grund.«"
        options:
          - id: an_frag_jakob
            text: "»Erzählen Sie mir von ihm.«"
            goto: an_jakob
      an_jakob:
        say: "»Er ist in Krögers Kolonne, Schuppen 17. Jakob klaut nicht. Jakob zählt.« Zum ersten Mal sieht sie weg, auf ihre Hände. »Seit Russland zählt er jeden Löffel Suppe, jede Stufe, jede Kiste, die der Kran aus einem Schiff hebt. Alles schreibt er in ein Heft. Das hat ihn durch die Gefangenschaft gebracht, sagt er.«"
        do:
          - say: "Sie holt Luft, und ihre Stimme wird härter. »Freitag früh haben sie seinen Spind aufgemacht, Nummer 23. Kröger hat aufgeschlossen, das ist sein Vorarbeiter, und Kommissar Petersen hat zugesehen. Drin lagen zwei Stangen englische Zigaretten. Jetzt ist Jakob ein Dieb, der mit der Beute abgehauen ist. Das schreibt Petersen in seine Akte, und dann sucht er nicht weiter.«"
          - learn: clue_auftrag
        options:
          - id: an_frag_schluessel
            text: "»Wer hat einen Schlüssel zu dem Spind?«"
            goto: an_schluessel
      an_schluessel:
        say: "Statt einer Antwort öffnet sie die Handtasche und legt einen kleinen Schlüssel auf deinen Schreibtisch. An ihm hängt eine Blechmarke mit der Nummer 23. »Jakob hat ihn. Und der hängt seit Donnerstagmittag bei uns am Haken. Er hatte ihn vergessen, zum ersten Mal in elf Jahren. Ich hab es dem Kommissar gesagt. Er hat es nicht aufgeschrieben.«"
        do:
          - say: Du schreibst mit, wie früher bei der Versicherung, wenn ein Schaden zu glatt aussah. Ein einzelner Eintrag im Notizbuch beweist nichts. Erst wenn du zwei kombinierst, die zusammenpassen, wird ein Schluss daraus, und mit Schlüssen kann man arbeiten.
          - learn: clue_schluessel
          - move: { object: spindschluessel, to: inventory }
        options:
          - id: an_annehmen
            text: "»Ich übernehme den Fall. Ich finde ihn.«"
            goto: an_bezahlung
      an_bezahlung:
        say: "Sie nickt, als hätte sie nichts anderes erwartet, und schiebt dir ein Bündel Scheine über den Tisch. »Zweihundert Reichsmark. Ab morgen ist es Papier, also nehmen Sie es heute. Den Rest brauch ich Sonntag an der Kartenstelle: vierzig für mich, vierzig für Lotte, vierzig für Jakob.« Sie sagt den letzten Namen genauso fest wie die anderen."
        do:
          - say: "»Fragen Sie Tadeusz am Zollkanal. Er ist Jakobs Freund, sie trinken nachts zusammen Muckefuck, Ersatzkaffee aus der Thermoskanne. Ich bin in der Siedlung, Hütte 14.« Dann ist sie fort, so schnell, wie man geht, wenn man nicht weinen will. Auf dem Besucherstuhl bleibt ein nasser Fleck."
          - say: Du ordnest, was du hast. Ein Spind, zu dem Jakob seit Donnerstagmittag keinen Schlüssel mehr hatte, und in dem trotzdem Diebesgut lag. Ein Freund am Zollkanal. Ein Vorarbeiter, der beim Aufschließen dabei war. Das ist nicht viel. Aber es ist mehr, als der Kommissar aufgeschrieben hat.
          - move: { object: reichsmark, to: inventory }
          - set: auftrag_angenommen
          - move: { object: anni, to: nissenhuette }
        # No options: the scene ends with her leaving.

  # -------------------------------------------------------------------------
  # P6: Annis Blechdose. Default dialogue of anni (in nissenhuette).
  # Also started by rule show_lene_anni.
  # -------------------------------------------------------------------------
  anni_huette:
    with: anni
    start: ah_hub
    nodes:
      ah_hub:
        say:
          - when: { has: clue_schweigegeld }
            text: "Anni lässt die Nadel sinken. »Haben Sie ihn gefunden, Voss?« Sie fragt es jedes Mal, und jedes Mal klingt es, als hätte sie sich die Antwort schon selbst gegeben."
          - text: "»Und? Haben Sie was?« Die Nadel geht weiter durch den Stoff, gleichmäßig, als hinge davon etwas ab. Hinter der Wolldecke atmet Lotte im Schlaf."
        options:
          - id: ah_kuvert
            text: "»Kröger war Freitagabend hier. Mit einem Kuvert.«"
            when:
              - has: clue_lene
              - not: { has: clue_schweigegeld }
            goto: ah_kuvert
          - id: ah_lebt
            text: "»Jakob lebt, Frau Brodersen.«"
            when: { has: clue_gestaendnis }
            goto: ah_lebt
          - id: ah_lotte
            text: "»Wie geht es Lotte?«"
            goto: ah_lotte
          - id: ah_tschuess
            text: "»Ich melde mich.«"
      ah_kuvert:
        say: "Lange sagt sie nichts. Die Nadel steckt im Stoff, ihre Hand liegt daneben. Dann steht sie auf, holt die Blechdose vom Bord und stellt sie vor dich hin, wie man einen Beweis vor Gericht hinlegt. Darin liegt nur noch ein leeres Kuvert mit einem Stempel: ›A. & Co. · Speicher K‹. »Zweihundert Reichsmark«, sagt sie. »›Von der Kolonne‹, hat er gesagt. Die Kolonne hat noch nie für irgendwen gesammelt.«"
        do:
          - learn: clue_schweigegeld
          - score: 1
          - if:
              when: { has: clue_asmussen }
              then:
                - say: Du drehst das Kuvert um. A. & Co., Speicher K, und Speicher K steht auch auf der Karte, die dir Asmussen am Baumwall in die Hand gedrückt hat. Kröger hat nicht sein eigenes Geld gebracht. Jemand hat ihm das Kuvert gefüllt, und dieser Jemand sitzt in Speicher K.
              else:
                - say: Du drehst das Kuvert um. A. & Co., Speicher K. Kröger hat nicht sein eigenes Geld gebracht, nicht zweihundert Mark von einem Vorarbeiterlohn. Jemand hat ihm das Kuvert gefüllt, und dieser Jemand sitzt in Speicher K.
        options:
          - id: ah_warum
            text: "»Und wo ist das Geld jetzt?«"
            goto: ah_warum
      ah_warum:
        say:
          - when: { has: reichsmark }
            text: "Zum ersten Mal lächelt sie, und es ist kein freundliches Lächeln. »In Ihrer Tasche, Voss. Ich hab Sie davon bezahlt. Ich hab mir gedacht: Wenn es schon Schweigegeld ist, soll es wenigstens für Jakob reden.« Sie nimmt die Nadel wieder auf. »Jetzt reden Sie.«"
          - text: "Zum ersten Mal lächelt sie, und es ist kein freundliches Lächeln. »Ich hab Sie davon bezahlt, Voss. Wo es jetzt ist, will ich nicht wissen. Ich hab mir gedacht: Wenn es schon Schweigegeld ist, soll es wenigstens für Jakob reden.« Sie nimmt die Nadel wieder auf. »Jetzt reden Sie.«"
        # No options: her line closes the scene.
      ah_lebt:
        say:
          - when: { has: clue_jakob_aussage }
            text: "Anni legt die Nadel weg. »Haben Sie ihn gesehen?« Du nickst und erzählst ihr vom vierten Stock, vom Bein, von der Wasserkanne, und dann richtest du aus, was er dir aufgetragen hat: Er hat richtig gezählt. Sie nickt, als hätte sie nie etwas anderes geglaubt, und erst als du schon an der Tür bist, hörst du, dass sie sehr leise weint."
          - text: "Anni legt die Nadel weg, sehr langsam, als könnte sie sonst etwas zerbrechen. »Lebt«, sagt sie nur. Dann wird ihre Stimme wieder die alte. »Dann holen Sie ihn nach Hause. Was stehen Sie hier noch rum?« Sie dreht sich zur Wand, damit du ihr Gesicht nicht siehst."
        # No options: the scene ends on Anni's gesture.
      ah_lotte:
        say: "»Sie schläft.« Anni sieht zur Wolldecke hinüber. »Wer schläft, hat keinen Hunger. Morgen gibt es vierzig neue Mark für sie, und am Montag vielleicht Brot, das nach Brot schmeckt.«"

  # -------------------------------------------------------------------------
  # P7: Das Verhör. Default dialogue of kroeger (in kneipe).
  # Progress: counter kroeger_stufe 0..4, set only here. A wrong piece of
  # evidence gets a rebuttal and returns to the same stage node. While the
  # deduction a stage needs is missing, the rebuttal is followed by a nudge
  # that points to the notebook (stage 1) or to the missing witness (2, 4).
  # Stage 3 needs none: stage 2 is only passed with Jakob's Heft, which
  # Tadeusz hands over only for »Untergeschoben«.
  # -------------------------------------------------------------------------
  kroeger_verhoer:
    with: kroeger
    start: k_hub
    nodes:
      k_hub:
        say:
          - when: { has: clue_gestaendnis }
            text: "Kröger dreht sein leeres Glas zwischen den Fingern. »Was wollen Se noch? Ich hab alles gesagt. Mehr als in zwanzig Jahren.«"
          - when: { counter: { name: kroeger_stufe, gte: 1 } }
            text: "Kröger sieht dich kommen und dreht das Glas weg, als könnte er so auch sich selbst wegdrehen. »Se geben wohl nie auf, Voss.«"
          - when: { has: clue_kroeger_version }
            text: "»Na, Voss. Noch ’ne Runde?« Kröger schiebt dir keinen Stuhl hin, und seine Kolonne zwei Tische weiter hört auf zu reden."
          - text: "Kröger mustert dich über seinen Köm hinweg, bevor du etwas gesagt hast. »Die Spürnase von der Brodersen. Hab schon gehört.« Dann zählt er es dir auf, Punkt für Punkt, wie einer, der es geübt hat: »Hundertachtzig Kisten, sauber gezählt, der Rest is Schwund. Brodersen hat um Mitternacht Schluss gemacht. Im Spind lag die Ware. Und mit seiner Frau hab ich nix zu schaffen.«"
        do:
          - if:
              when: { not: { has: clue_kroeger_version } }
              then:
                - say: Vier Behauptungen, fertig sortiert, bevor du eine einzige Frage gestellt hast. Wer so vorbereitet ist, hat damit gerechnet, dass jemand kommt. Du schreibst alle vier in dein Notizbuch. Für jede wirst du einen Beweis brauchen, und ohne Beweise lässt dich Kröger hier nur seinen Köm bewachen.
          - learn: clue_kroeger_version
        options:
          - id: k_verhoer1
            text: "»Reden wir über Donnerstagnacht.«"
            when: { counter: { name: kroeger_stufe, eq: 0 } }
            goto: k_s1
          - id: k_verhoer2
            text: "»Weiter, Kröger. Brodersens Feierabend.«"
            when: { counter: { name: kroeger_stufe, eq: 1 } }
            goto: k_s2
          - id: k_verhoer3
            text: "»Weiter. Der Spind.«"
            when: { counter: { name: kroeger_stufe, eq: 2 } }
            goto: k_s3
          - id: k_verhoer4
            text: "»Weiter. Die Brodersens.«"
            when: { counter: { name: kroeger_stufe, eq: 3 } }
            goto: k_s4
          - id: k_weg
            text: "»Wie komme ich zu Jakob?«"
            when: { has: clue_gestaendnis }
            goto: k_weg
          - id: k_tschuess
            text: "»Prost, Kröger.«"

      # Stage 1: Schwund. Valid: clue_kein_schwund (D5).
      k_s1:
        say: "Kröger lehnt sich zurück. »Was fehlt, is Schwund. Im Hafen schwindet immer was. Kisten, Kaffee …« Er macht eine Pause, die zu lang ist. »… Leute.«"
        do:
          - if:
              when:
                not:
                  any:
                    - { has: clue_zwanzig_kisten }
                    - { has: clue_lene }
                    - { has: clue_zaehlheft }
                    - { has: clue_kein_schwund }
              then:
                - say: Er hat seine Geschichte, und du hast nichts in der Hand, was dagegen hält. Noch nicht. Seine Zählung müsstest du nachprüfen, und herausfinden, wo die Ware hingeht.
        options:
          - id: k_s1_zwanzig
            text: "»Zwanzig Kisten fehlen. Und Sie haben gezählt.«"
            when: { has: clue_zwanzig_kisten }
            do:
              - say: "Kröger grinst. »Und wo solln die hin sein? Ins Hafenbecken?«"
              - if:
                  when: { not: { has: clue_kein_schwund } }
                  then:
                    - say:
                        - when: { has: clue_lene }
                          text: Gute Frage, und die Antwort steht schon in deinem Notizbuch, verteilt auf zwei Einträge. Erst kombiniert nagelt sie ihn fest.
                        - text: Gute Frage. Eine fehlende Zahl ist noch kein Beweis, solange keiner weiß, wo die Kisten geblieben sind. Wer verdient an zwanzig Kisten Zigaretten?
            goto: k_s1
          - id: k_s1_lene
            text: "»Sie haben Lene Zigaretten verkauft.«"
            when: { has: clue_lene }
            do:
              - say: "»’n paar Stangen, na und? Die ganze Stadt verkauft Stangen. Was hat das mit meiner Zählung zu tun?«"
              - if:
                  when: { not: { has: clue_kein_schwund } }
                  then:
                    - say:
                        - when: { has: clue_zwanzig_kisten }
                          text: Mehr, als er glaubt. Die Antwort steht schon in deinem Notizbuch, verteilt auf zwei Einträge. Erst kombiniert nagelt sie ihn fest.
                        - text: Mehr, als er glaubt, aber das musst du erst beweisen. Hast du nachgeprüft, was er gezählt hat?
            goto: k_s1
          - id: k_s1_kein_schwund
            text: "»Kein Schwund. Lene verkauft Ihr Los 4471.«"
            when: { has: clue_kein_schwund }
            do:
              - say: "Kröger setzt das Glas an und trinkt doch nicht. Du erzählst ihm, was auf der Ladeliste steht, was auf seinem Zählzettel steht und was Lene im Bauchladen hat, und mit jedem Satz wird er stiller. »Lene redet viel, wenn der Tag lang is«, sagt er schließlich. Aber er sagt nicht mehr, dass es Schwund war."
              - counter: { name: kroeger_stufe, set: 1 }
              - score: 1
            goto: k_s2
          - id: k_s1_heft
            text: "»Jakobs Heft sagt: zwanzig Kisten in die ›Elise 7‹.«"
            when: { has: clue_zaehlheft }
            do:
              - say: "»Da steht K. Und geschrieben hat das ’n Dieb.«"
              - if:
                  when: { not: { has: clue_kein_schwund } }
                  then:
                    - say: Ein Heft gegen sein Wort, und das Heft gehört einem Mann, den die Polizei für einen Dieb hält. Gegen den Schwund brauchst du einen Schluss aus deinem Notizbuch, keinen einzelnen Eintrag.
            goto: k_s1
          - id: k_s1_raus
            text: "»Ein andermal.«"

      # Stage 2: Mitternacht Schluss. Valid: clue_zaehlheft (P5).
      k_s2:
        say: "Kröger lehnt sich zurück und sucht sich die nächste Behauptung aus, wie man sich beim Kartenspiel die nächste Karte aussucht. »Brodersen hat um Mitternacht Schluss gemacht. Danach weiß ich nix. Wo einer nach Feierabend hingeht, is nich meine Sache.«"
        options:
          - id: k_s2_tally
            text: "»Ihr Zählzettel sagt hundertachtzig.«"
            when: { has: clue_tally }
            do:
              - say: "»Eben. Hundertachtzig. Steht da was von Brodersen?«"
              - if:
                  when: { not: { has: clue_zaehlheft } }
                  then:
                    - say: Nichts. Wer hat Jakob nach Mitternacht noch gesehen? Und wo ist das Heft, in das er alles schreibt?
            goto: k_s2
          - id: k_s2_heft
            text: "»Sein Zählheft sagt: letzte Kiste um 01:20.«"
            when: { has: clue_zaehlheft }
            do:
              - say: "Du legst das Heft auf den Tisch, aufgeschlagen bei der letzten Zeile. Kröger muss nicht lesen, um zu wissen, was dasteht. Er dreht das Glas einmal um sich selbst. »Brodersen und sein Heft«, sagt er, und es klingt fast zärtlich. »Der zählt sogar die Möwen.« Um Mitternacht hat keiner Schluss gemacht. Das weiß er, und jetzt weiß er, dass du es weißt."
              - counter: { name: kroeger_stufe, set: 2 }
              - score: 1
            goto: k_s3
          - id: k_s2_raus
            text: "»Ein andermal.«"

      # Stage 3: Dieb bleibt Dieb. Valid: clue_untergeschoben (D4).
      # Each half of D4 alone gets a rebuttal that names the other half.
      k_s3:
        say: "Kröger beugt sich vor. Jetzt kommt die Behauptung, auf die er sich am meisten verlässt. »Dieb bleibt Dieb. Ich hab den Spind selbst aufgeschlossen, vor der Polizei. Da lag die Ware. Das hat der Kommissar mit eigenen Augen gesehen.«"
        options:
          - id: k_s3_frisch
            text: "»Die Ware kam erst Donnerstagnacht an Land.«"
            when: { has: clue_frisch_an_land }
            do:
              - say: "»Na und? Er war ja Donnerstagnacht an Bord. Da kann er sich bedient haben.«"
            goto: k_s3
          - id: k_s3_nur
            text: "»Seit Donnerstagmittag kam nur Ihr Schlüssel an den Spind.«"
            when: { has: clue_nur_kroeger }
            do:
              - say: "»Und vorher hatte er seinen. Kann das Zeug schon Mittwoch reingelegt haben.«"
            goto: k_s3
          - id: k_s3_untergeschoben
            text: "»Sie haben ihm die Stangen untergeschoben.«"
            when: { has: clue_untergeschoben }
            do:
              - say: "Du legst es ihm in zwei Sätzen hin. Die Ware kam Donnerstagnacht an Land. Da hing Jakobs Schlüssel schon seit Stunden zu Hause am Haken, und der einzige andere steckt in Krögers Tasche. Zum ersten Mal sagt Kröger nichts. Zwei Tische weiter hört seine Kolonne auf zu reden, und das Schweigen breitet sich durch die Kneipe aus, bis sogar der Wirt nicht mehr zapft."
              - counter: { name: kroeger_stufe, set: 3 }
              - score: 1
            goto: k_s4
          - id: k_s3_raus
            text: "»Ein andermal.«"

      # Stage 4: Nix mit den Brodersens. Valid: clue_schweigegeld (P6).
      k_s4:
        say: "Kröger wird laut, und das ist neu. »Ich hab mit den Brodersens nix zu schaffen! Seine Frau kenn ich kaum!« Ein paar Köpfe drehen sich um. Er senkt die Stimme wieder, aber seine Hand um das Glas ist weiß geworden."
        options:
          - id: k_s4_lene
            text: "»Lene hat Sie Freitag bei den Brodersens gesehen.«"
            when: { has: clue_lene }
            do:
              - say: "»Beigestanden hab ich. Als Vorarbeiter. Is das verboten?«"
              - if:
                  when: { not: { has: clue_schweigegeld } }
                  then:
                    - say: Beigestanden, mit einem Kuvert. Was in dem Kuvert war, weiß nur eine, und die hat es dir nicht erzählt.
            goto: k_s4
          - id: k_s4_heft
            text: "»Im Heft steht ›K.‹ – K wie Kröger.«"
            when: { has: clue_zaehlheft }
            do:
              - say: "»K wie Kran. K wie Kai. Lesen Se mal ein Hafenheft.«"
              - if:
                  when: { not: { has: clue_schweigegeld } }
                  then:
                    - say: Ein Buchstabe reicht nicht. Was hat Kröger am Freitagabend bei den Brodersens gewollt? Das weiß nur eine.
            goto: k_s4
          - id: k_s4_kuvert
            text: "»Sie haben Anni zweihundert Reichsmark gebracht.«"
            when: { has: clue_schweigegeld }
            do:
              - counter: { name: kroeger_stufe, set: 4 }
            goto: k_gestaendnis
          - id: k_s4_raus
            text: "»Ein andermal.«"

      # Confession: linear, ends with the only optional toggle (kroeger_zeuge).
      k_gestaendnis:
        say: "»Von der Kolonne«, sagst du. »In einem Kuvert mit dem Stempel von Speicher K.« Kröger starrt in sein Glas. Lange. Dann schiebt er es weg, und du merkst, dass er die ganze Zeit nur darauf gewartet hat, dass jemand fragt. »Ich hab ihn nicht geschubst, ehrlich. Er is mir nach, bis rauf zur Luke. Da is er auf der Treppe an der Ladeluke ausgerutscht, und das Bein war hin. Ich hab’s knacken hören.«"
        do:
          - say: "Er schluckt. »Ich wollt ’n Arzt holen. Wirklich. Aber dann kam … es kam einer, der hat gesagt, das geht nich. Seitdem bring ich ihm jeden Abend Wasser. Jeden Abend, Voss. Mit dem Boot.« Er sieht dich an wie einer, der eine Last abgesetzt hat und nicht weiß, wohin mit den Händen."
          - learn: clue_gestaendnis
          - score: 2
        options:
          - id: k_g_wo
            text: "»Wo ist er, Kröger?«"
            goto: k_wo
      # Location, key, Persilschein and the way across in one beat.
      k_wo:
        say: "»Speicher K. Vierter Stock.« Er legt einen Schlüssel an einer Schnur auf den Tisch, dann ein gefaltetes Papier, abgegriffen an den Kanten. »Das hat Asmussen mir geschrieben. Persilschein. Fleißiger, unpolitischer Arbeiter. Ohne den Wisch bin ich wieder der Kröger von dreiunddreißig, mit der Binde am Arm, und keiner gibt mir mehr ’ne Kolonne.«"
        do:
          - say: "»Über die Brücke kommen Se nachts nicht, da is der Zoll. Ich nehm jeden Abend das Boot vom Wächter am Zollkanal. Der sieht weg. Der sieht immer weg.« Kröger hebt den Kopf, und zum ersten Mal an diesem Abend fragt er etwas. »Was wird jetzt aus mir?«"
          - say: "Ein Persilschein, so nennt man diese Gefälligkeitsbescheinigungen, mit denen einer dem anderen bestätigt, er sei nie ein richtiger Nazi gewesen. Asmussen also. Der Mann, der Kröger damit reingewaschen hat, ist derselbe, dem Speicher K gehört und der am Baumwall nichts von Brodersen wissen wollte. Kröger hat einen Herrn, und er hat ihn gerade genannt, ohne es zu merken. Wer den Arzt verboten hat, kann dir nur einer sagen, der dabei war: Jakob."
          - move: { object: bodenschluessel, to: inventory }
          - learn: clue_persilschein
        options:
          - id: k_g_zeuge
            text: "»Sagen Sie gegen Asmussen aus. Dann sag ich für Sie aus.«"
            do:
              - set: kroeger_zeuge
              - say: "Kröger nickt einmal, kurz und schwer, wie beim Verladen, wenn die Last am Haken sitzt. »Is gut«, sagt er. »Is gut.«"
          - id: k_g_richter
            text: "»Das entscheidet ein Richter.«"
            do:
              - say: "Kröger nickt. Er hat nichts anderes erwartet, und vielleicht ist es ihm sogar lieber so."
      k_weg:
        say: "»Übers Wasser. Fragen Se den Wächter am Zollkanal.« Er sieht auf seine Hände. »Und sagen Se Brodersen …« Er bricht ab und schüttelt den Kopf, als wäre der Satz zu schwer für ihn. »Ach, lassen Se’s.«"

  # -------------------------------------------------------------------------
  # Forced scene at the Baumwall. Started by enter rule asmussen_hinterhalt.
  # Strictly linear, adds no optional state.
  # -------------------------------------------------------------------------
  asmussen_warnung:
    with: asmussen
    start: a_w_start
    nodes:
      a_w_start:
        say: "Unter dem Viadukt löst sich ein Mann aus dem Regen, als hätte er auf dich gewartet. Kamelhaarmantel, Siegelring, und sein Hut ist der einzige trockene in Hamburg. Er reicht dir eine Karte, bevor du ausweichen kannst. »Voss, nicht wahr? Asmussen, Kaffee-Import. Sie haben vor dem Krieg meine Ladungen versichert.« Er lächelt. »Und jetzt fragen Sie im Hafen herum, höre ich.«"
        do:
          - learn: clue_asmussen
        options:
          - id: a_w_wer
            text: "»Kennen Sie Jakob Brodersen?«"
            goto: a_w_geld
      a_w_geld:
        say: "»Ich kenne keinen Brodersen. Und Speicher K ist seit dreiundvierzig eine Ruine, da lagert niemand etwas.« Er zieht ein Bündel aus der Manteltasche und zählt Scheine ab, ohne hinzusehen. »Fünfhundert Reichsmark. Für Ihre Mühe, und für die Erinnerung an alte Zeiten. Gehen Sie nach Hause, Voss. Es regnet.«"
        options:
          - id: a_w_ablehnen
            text: "»Behalten Sie’s. Ab morgen ist es Altpapier.«"
            do:
              - move: { object: asmussen, to: kontor }
              - say: "Er lächelt, als kenne er den Witz schon. »Wie Sie meinen.« Der Mantel verschwindet Richtung Speicherstadt, und der Regen schließt sich hinter ihm."
              - say: Du siehst auf die Karte in deiner Hand. Nach Speicher K hatte ihn niemand gefragt, und trotzdem war es das Erste, was er abgestritten hat. Ein Mann, der fünfhundert Mark bietet, damit du aufhörst, hat Angst vor dem, was du findest, wenn du weitermachst.

  # -------------------------------------------------------------------------
  # P4b: the backyard. Default dialogue of lene (in hinterhof).
  # Same result as the rules show_paeckchen_lene / show_los_lene.
  # Lene says »du« to Voss on purpose: she does it to anyone who isn't buying.
  # -------------------------------------------------------------------------
  lene_gespraech:
    with: lene
    start: l_hub
    nodes:
      l_hub:
        say:
          - when: { has: clue_lene }
            text: "»Ich hab dir alles gesagt. Und ’n bisschen mehr.« Lene zählt Feuersteine ab, als wärst du schon weg."
          - text: "Lene lässt dich herankommen und sieht dabei nicht dich an, sondern deine Taschen. »Feuersteine, Nähnadeln, gute Ratschläge, Schätzchen. Die Ratschläge kosten extra.«"
        options:
          - id: l_zigaretten
            text: "»Haben Sie auch Zigaretten?«"
            when: { not: { has: clue_lene } }
            goto: l_luege
          - id: l_los
            text: "»Und was ist hiermit? Los 4471.«"
            when:
              - has: zigarettenpaeckchen
              - not: { has: clue_lene }
            goto: l_redet
          - id: l_montag
            text: "»Was wird aus Ihnen ab Montag?«"
            goto: l_montag
          - id: l_tschuess
            text: "»Schönen Abend noch.«"
      l_luege:
        say: "»Zigaretten? Ich rauch nicht mal.« Sie sagt es, ohne zu zögern, aber unter den Hosenknöpfen in ihrem Bauchladen blitzt eine Banderole, und sie rückt die Knöpfe nicht zurecht."
        options:
          - id: l_zurueck1
            text: "»Natürlich nicht.«"
            goto: l_hub
      l_redet:
        say: "Du hältst ihr das Päckchen hin, die Banderole nach oben. Lene sieht es an, dann dich, und zum ersten Mal hört sie auf zu rechnen. »Freitag, sechs Uhr früh. Kröger. Fünf Stangen, dieselbe Nummer, für einen Preis, der zu gut war.« Sie spricht leise. »›Der Rest gehört dem Kaffeemann aus der Speicherstadt‹, hat er gesagt. Als ob ich das wissen wollte.«"
        do:
          - say: "»Und am Abend is er bei den Brodersens rein. Mit ’nem Kuvert in der Hand und ’nem Gesicht wie zur Beerdigung. Ich wohn drei Hütten weiter, ich seh so was.« Sie tippt an ihre Schaffnermütze. »Der Ratschlag war umsonst, Schätzchen. Wegen Jakob. Der hat mir mal beim Ofen geholfen.«"
          - learn: clue_lene
          - score: 1
          - say: Fünf Stangen für Lene, der Rest für einen Kaffeemann. Kröger hat die Ware nicht verloren, er hat sie verteilt. Und hinterher ist er mit einem Kuvert zu der Frau gegangen, deren Mann er zum Dieb gemacht hat. Davon hat Anni dir nichts erzählt.
        # No options: she has said what she will say.
      l_montag:
        say: "»Wart’s ab: Am Montag sind die Schaufenster voll. Alles, was es seit Jahren nicht gibt, liegt dann da, als wär’s vom Himmel gefallen.« Sie lacht kurz. »Und keiner fragt, wo das Zeug bis Sonntag war. Ich mach dann wieder Straßenbahn.«"

  # -------------------------------------------------------------------------
  # P5 and the Act III crossing. Default dialogue of tadeusz (in zollkanal).
  # Also started by the show_* redirects in rules.yaml.
  # -------------------------------------------------------------------------
  tadeusz_gespraech:
    with: tadeusz
    start: t_hub
    nodes:
      t_hub:
        say:
          - when: { has: clue_jakob_aussage }
            text: "Tadeusz hält das Boot an der Kaimauer fest. Auf der Sitzbank stehen zwei Becher Muckefuck, und einer davon ist für Jakob."
          - when: { flag: tadeusz_rudert }
            text: "Tadeusz hält das Boot an der Kaimauer fest und sieht hinüber zur Speicherstadt. »Wann immer Sie so weit sind, Voss.«"
          - when: { has: clue_zaehlheft }
            text: "Die Thermoskanne steht offen, und Tadeusz hat dir einen Becher eingeschenkt. Er sieht aufs Wasser, wenn er spricht, als wäre das leichter."
          - text: "Tadeusz sieht dich kommen und schraubt die Thermoskanne fester zu, als wäre das Gespräch damit schon beendet. Er ist schmal und älter, als er sein dürfte, und er wartet darauf, dass du zuerst etwas sagst."
        options:
          - id: t_jakob
            text: "»Sie sind Jakobs Freund.«"
            when: { not: { has: clue_zaehlheft } }
            goto: t_jakob
          - id: t_kein_dieb
            text: "»Jakob ist kein Dieb. Ich kann es beweisen.«"
            when:
              - has: clue_untergeschoben
              - not: { has: clue_zaehlheft }
            goto: t_heft
          - id: t_ueberfahrt
            text: "»Jakob lebt. Speicher K, vierter Stock.«"
            when:
              - has: clue_gestaendnis
              - not: { flag: tadeusz_rudert }
            do:
              - set: tadeusz_rudert
            goto: t_rudern
          - id: t_halina
            text: "»Worauf warten Sie, Tadeusz?«"
            goto: t_halina
          - id: t_tschuess
            text: "»Gute Nacht, Tadeusz.«"
      t_jakob:
        say: "»Wir trinken jede Nacht zusammen Muckefuck, seit einem Jahr. Er zählt die Kähne, ich zähle die Stunden.« Er sieht aufs Wasser. »Seit Donnerstag trinke ich allein. Wenn Jakob ein Dieb ist, bin ich der Freund eines Diebes, und das kann ich mir nicht leisten. Wenn nicht …« Er hebt die Schultern. »Dann ist das etwas anderes. Dann kommen Sie mit einem Beweis wieder.«"
        # No options: he has set his condition.
      t_heft:
        say: "Du erklärst es ihm: die Ware, die erst Donnerstagnacht an Land kam, und der Schlüssel, der seit Mittag zu Hause hing. Er hört zu, ohne zu nicken. Dann steht er auf, geht in die Wachbude und kommt mit einem Heft zurück, dessen Ecken vom vielen Blättern rund sind. »Von Jakob. Um halb zwei hat er es mir gegeben. ›Wenn ich bis morgen nicht zurück bin, gib es Anni.‹« Er hält es dir hin. »Ich habe es ihr nicht gegeben.«"
        do:
          - learn: clue_zaehlheft
          - score: 1
          - say: "Du blätterst bis zur letzten beschriebenen Seite. Jakobs Schrift ist klein und ordentlich, Zahl unter Zahl: ›200 Kisten, letzte 01:20. Zählung 180?! K. lässt 20 Ki. in Elise 7. Geh hinterher.‹ Jakob hat gesehen, was du dir erst zusammenrechnen musstest, und er ist der Ware nachgegangen."
        options:
          - id: t_wohin
            text: "»Wohin ist er gegangen?«"
            goto: t_elise
      t_elise:
        say: "»Hinter dem Lastkahn ›Elise 7‹ her, am Kanal entlang, Richtung Speicherstadt. Ich habe ihm nachgesehen, bis der Regen ihn hatte.« Tadeusz schlägt das Register der Lastkähne in der Wachbude auf und legt den Finger auf eine Zeile. »Hier steht, wem sie gehört: A. & Co., Speicher K.«"
        do:
          - if:
              when: { has: clue_asmussen }
              then:
                - say: Speicher K. Das Haus, das Asmussen am Baumwall so eilig zur Ruine erklärt hat, obwohl niemand ihn danach gefragt hatte.
        options:
          - id: t_angst
            text: "»Warum haben Sie geschwiegen?«"
            goto: t_dp
      t_dp:
        say: "Er antwortet nicht sofort. »Am Freitag hat die Polizei ›die Polen‹ befragt. So hat es der Beamte gesagt, ›die Polen‹. Für Ihre Polizei bin ich ein DP, eine Displaced Person, ein Mensch am falschen Ort. Und wer am falschen Ort ist, hat immer etwas gestohlen.« Er dreht den Becher in den Händen. »Ein Heft von einem Dieb, bei einem Polen gefunden. Was meinen Sie, wem man geglaubt hätte?«"
        do:
          - if:
              when: { has: clue_tally }
              then:
                - say: Du siehst noch einmal ins Heft. ›Zählung 180?!‹ Jakob hat dieselbe Zahl gesehen, die auf Krögers Zählzettel steht, und gewusst, dass sie nicht stimmt.
              else:
                - say: Du siehst noch einmal ins Heft. ›Zählung 180?!‹ Den Zählzettel der Nacht hast du in Schuppen 17 hängen sehen, hinter Glas, außer Reichweite. Mit etwas Langem, das einen Haken hat, käme man vielleicht heran.
        # No options: the answer ends the scene.
      t_rudern:
        say: "Tadeusz steht auf, sehr langsam. »Kröger nimmt jeden Abend mein Boot. Er sagt, er holt Kaffee. Ich wusste, dass er lügt, und ich habe weggesehen.« Er sieht dich an. »Ich habe fünf Jahre gelernt, nichts zu sehen. Das verlernt man nicht in drei Jahren.« Dann geht er die Kaitreppe hinunter und macht das Boot los. »Die Brücke ist zu, Voss. Das Wasser nicht.«"
        do:
          - say: Unten im Boot nimmt er die Ruder und wartet, bis du eingestiegen bist. Drüben, über dem schwarzen Wasser, sind die Luken im vierten Stock von Speicher K frisch mit Brettern vernagelt.
      t_halina:
        say: "»Auf Papiere. Kanada, als Holzfäller, wenn sie mich nehmen. Und auf einen Namen auf einer Suchliste: Halina Wrona, meine Schwester. Sie war sechzehn, als man uns getrennt hat.« Er lächelt kaum. »Sie suchen einen Mann, Voss, ich suche eine Schwester. Wir haben beide nur Papier in der Hand.«"
        options:
          - id: t_zurueck2
            text: "»Ich hoffe, Sie finden sie.«"

  # -------------------------------------------------------------------------
  # P8: the rescue. Default dialogue of jakob (in vierter_boden).
  # On the first talk j_was is the only option, so the testimony is certain.
  # -------------------------------------------------------------------------
  jakob_gespraech:
    with: jakob
    start: j_start
    nodes:
      j_start:
        say:
          - when: { has: clue_jakob_aussage }
            text: "»Bringen Sie’s zu Ende, Voss. Ich zähl solange die Tropfen vom Dach. Bin bei vierhundertzwölf.«"
          - text: "Der Mann am Pfeiler hebt die Hand gegen das Licht der Laterne. Er ist unrasiert, die Lippen sind rissig, und er hat Fieber, das siehst du von hier. Aber seine Stimme ist klar. »Zweihundert«, sagt er, bevor du dich vorstellen kannst. »Ich hab zweihundert gezählt. Ich zähl immer.«"
        options:
          - id: j_was
            text: "»Was ist passiert, Jakob?«"
            when: { not: { has: clue_jakob_aussage } }
            goto: j_was
          - id: j_tschuess
            text: "»Ich hole Sie hier raus.«"
            when: { has: clue_jakob_aussage }
      j_was:
        say: "»Kröger hat mich oben an der Luke erwischt. Ich wollt nur sehen, wo die Kisten hingehen. Dann bin ich die Treppe runter, rückwärts.« Er verzieht das Gesicht. »Das Bein. Kröger is runtergekommen und war weißer als ich. Dann kam einer im Kamelhaarmantel, mit Hut. Kröger wollte ’n Arzt holen, das hat er gesagt, zweimal. Und der Mantel hat gesagt: ›Kein Arzt. Ärzte reden.‹«"
        do:
          - learn: clue_jakob_aussage
          - score: 1
          - say: Ein Mann im Kamelhaarmantel. Du hast heute Abend nur einen gesehen, und der hat dir fünfhundert Mark geboten, damit du nach Hause gehst. Der grobe Vorarbeiter wollte einen Arzt holen. Der feine Herr hat Nein gesagt.
        options:
          - id: j_durchhalten
            text: "»Halten Sie durch. Heute Nacht noch.«"
            goto: j_ende
      j_ende:
        say: "Jakob nickt und lässt den Kopf gegen den Pfeiler sinken. »Grüßen Sie Anni. Sagen Sie ihr, ich hab richtig gezählt.« Nach einer Weile, als du schon glaubst, er schläft: »Und Kröger … nee. Kröger sagen Sie gar nix. Der weiß es selber.«"

  # -------------------------------------------------------------------------
  # Finale: Die Abrechnung. Default dialogue of asmussen (in kontor).
  # Stateless ladder: three rungs, one valid proof each. Leaving restarts at
  # rung 1; the Kontor opens only with all three proofs in the notebook
  # (exit speicher_treppe.down). Points only in the final choice.
  # -------------------------------------------------------------------------
  asmussen_finale:
    with: asmussen
    start: f_start
    nodes:
      f_start:
        say: "Asmussen sieht nicht auf, als du hereinkommst. Er schreibt etwas zu Ende, schraubt den Füllhalter zu und legt ihn parallel zur Tischkante. »Voss«, sagt er dann. »Sie tropfen auf meinen Teppich.«"
        options:
          - id: f_anklage
            text: "»Ich war oben, Asmussen. Vierter Stock.«"
            do:
              - say: "»Oben?« Er hebt eine Augenbraue, als hätte er das Wort noch nie gehört. »Da lagert nichts. Und wenn doch, fragen Sie Kröger. Der hat die Schlüssel.«"
            goto: f_s1
          - id: f_gehen
            text: "»Ein andermal.«"

      # Rung 1: »Ich kenne den Mann kaum.« Valid: clue_persilschein.
      f_s1:
        say: "»Kröger ist ein Vorarbeiter unter Hunderten, Voss. Ich beschäftige Leute, ich kenne sie nicht. Ich kenne den Mann kaum.«"
        options:
          - id: f_s1_kuvert
            text: "»Ihr Kuvert lag bei Anni Brodersen.«"
            when: { has: clue_schweigegeld }
            do:
              - say: "»Kuverts mit meinem Stempel liegen im ganzen Hafen herum. Ich verschicke viel Post.«"
            goto: f_s1
          - id: f_s1_persil
            text: "»›Ich kenne Herrn Kröger seit 1934.‹ Ihr Persilschein.«"
            when: { has: clue_persilschein }
            do:
              - say: "Du legst das Papier auf den Mahagoni, so dass er seine eigene Unterschrift lesen kann. Er liest sie nicht. »Persilschein«, sagt er. »Ein hässliches Wort. Ich nenne es: für einen Mitarbeiter gebürgt. Das haben in diesem Frühjahr viele getan, Voss. Es war eine Christenpflicht.«"
            goto: f_s2
          - id: f_s1_jakob
            text: "»Jakob hat Sie gesehen.«"
            when: { has: clue_jakob_aussage }
            do:
              - say: "»Ein Mann im Fieber sieht einen Mantel. Davon gibt es viele in Hamburg.«"
            goto: f_s1
          - id: f_gehen1
            text: "»Ein andermal.«"

      # Rung 2: »Hinter meinem Rücken.« Valid: clue_dieselbe_hand (D6).
      f_s2:
        say: "Asmussen faltet die Hände auf dem Tisch. Er wechselt die Verteidigung, ohne dass sich sein Gesicht bewegt. »Gut. Wenn oben Ware liegt, hat Kröger sie versteckt. Hinter meinem Rücken. Sie wissen selbst, was Vorarbeiter in diesen Zeiten alles nebenher machen.«"
        options:
          - id: f_s2_elise
            text: "»Ihr Lastkahn hat die Kisten gebracht.«"
            when: { has: clue_zaehlheft }
            do:
              - say: "»Mein Kahn fährt für jeden, der zahlt.«"
            goto: f_s2
          - id: f_s2_zettel
            text: "»Oben lag Ihre Anweisung an Kröger.«"
            when: { has: clue_anweisung }
            do:
              - say: "Asmussen lächelt. »Ohne Unterschrift? Die kann jeder geschrieben haben.«"
            goto: f_s2
          - id: f_s2_hand
            text: "»›Montag sechs Uhr geht die Ware raus.‹ Ihre Tinte. Ihr ›g‹.«"
            when: { has: clue_dieselbe_hand }
            do:
              - say: "Du legst die Abschrift des Zettels neben den Persilschein, und dann zeigst du auf den Füllhalter, der vor ihm liegt. Grüne Tinte. Das »g« mit der Schleife nach rechts, auf beiden Blättern dasselbe. Asmussen stellt die Tasse ab. Zum ersten Mal an diesem Abend sieht er dich wirklich an."
            goto: f_s3
          - id: f_gehen2
            text: "»Ein andermal.«"

      # Rung 3: »Ich habe ihm das Leben gerettet.« Valid: clue_jakob_aussage.
      f_s3:
        say: "»Also schön.« Er lehnt sich zurück, und jetzt spricht er wie ein Kaufmann, der eine Bilanz erklärt. »Ich habe Ware zurückgehalten, wie jeder vernünftige Kaufmann in dieser Woche. Und ohne mich läge Brodersen jetzt im Kanal, das kann ich Ihnen versichern. Kröger war in Panik. Ich habe ihm das Leben gerettet.«"
        options:
          - id: f_s3_spind
            text: "»Sie haben Jakob zum Dieb gemacht.«"
            when: { has: clue_untergeschoben }
            do:
              - say: "»Kröger hat ihm die Stangen untergeschoben, nicht ich. Fragen Sie, wer den zweiten Schlüssel hat.«"
            goto: f_s3
          - id: f_s3_kisten
            text: "»Zwanzig Kisten NAAFI-Ware hält man nicht zurück.«"
            when: { has: clue_zwanzig_kisten }
            do:
              - say: "»Die Engländer bekommen ihre Kisten. Mit Zinsen, wenn Sie wollen.«"
            goto: f_s3
          - id: f_s3_arzt
            text: "»Kröger wollte einen Arzt holen. Sie haben Nein gesagt.«"
            when: { has: clue_jakob_aussage }
            do:
              - say: "Du sagst es ihm Wort für Wort, so wie Jakob es gesagt hat: »Kein Arzt. Ärzte reden.« Seit Donnerstagnacht liegt ein Mann mit gebrochenem Bein auf dem vierten Stock, über diesem Zimmer mit dem warmen Ofen, und bekommt Wasser, aber kein Licht. Asmussen antwortet nicht. Er sieht auf seine Hände, als prüfe er, ob sie sauber sind."
            goto: f_angebot
          - id: f_gehen3
            text: "»Ein andermal.«"

      # The bribe and the refusal. The refrain is used here and nowhere else.
      f_angebot:
        say: "Als er wieder spricht, ist seine Stimme freundlich, und das ist schlimmer. »Zwei Sack Rohkaffee, Voss. Ab Montag mehr wert als Ihr ganzes Büro.« Er lehnt sich zurück. »Und tun Sie nicht so. Sie haben vor dem Krieg meine Ladungen versichert, Jahr für Jahr. Damals haben Sie auch nicht gefragt, woher die Ware kam.«"
        options:
          - id: f_ablehnen
            text: "»Geld kann man umtauschen. Schuld nicht.«"
            goto: f_wahl
      f_wahl:
        say: "Draußen wird der Regen grau, und irgendwo im Hafen läuft die erste Winde an. Asmussen greift nach dem Telefon und lässt die Hand dann darauf liegen, ohne abzuheben. »Und jetzt?«, fragt er. »Wem wollen Sie mich verkaufen?«"
        options:
          - id: f_englaender
            text: "»Den Engländern. Es ist ihre Ware.«"
            do:
              - score: 4
              - end: ende_erster_morgen
          - id: f_kripo
            text: "»Der Kripo. Es ist unsere Stadt.«"
            do:
              - score: 4
              - end: ende_hamburger_regen
