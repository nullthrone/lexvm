# yaml-language-server: $schema=../../schema/lexvm-pack-1.schema.json
#
# Dialogues of »Die letzte Nacht der Reichsmark«. Design: design/cast.md
# (dialogue plans), design/puzzles.md (walkthrough, score), design/style.md
# (voices). Option ids are unique across the whole pack. No option uses
# `once`: options that must disappear are gated on the clue they teach.

dialogues:
  # -------------------------------------------------------------------------
  # Act I: the intro. Linear, cannot be left half-way.
  # Started by rule talk_anni_auftrag while auftrag_angenommen is false.
  # -------------------------------------------------------------------------
  anni_auftrag:
    with: anni
    start: an_start
    nodes:
      an_start:
        say: "»Mein Mann ist weg. Jakob Brodersen, Schauermann. Seit Donnerstagnacht.« Sie sagt es wie eine Adresse, die sie zu oft aufschreiben musste."
        options:
          - id: an_frag_jakob
            text: "»Erzählen Sie mir von ihm.«"
            goto: an_jakob
      an_jakob:
        say: "»Er ist in Krögers Kolonne, Kaischuppen 17. Jakob klaut nicht. Jakob zählt. Seit Russland zählt er jeden Löffel Suppe – und jede Hieve. Alles in ein Heft.«"
        options:
          - id: an_frag_polizei
            text: "»Und die Polizei?«"
            goto: an_polizei
      an_polizei:
        say: "»Freitag früh haben sie seinen Spind aufgemacht, Nummer 23. Kröger hat aufgeschlossen. Zwei Stangen englische Zigaretten. Jetzt ist Jakob ein Dieb, der abgehauen ist.«"
        do:
          - learn: clue_auftrag
        options:
          - id: an_frag_schluessel
            text: "»Wer hat einen Schlüssel zu dem Spind?«"
            goto: an_schluessel
      an_schluessel:
        say: "Sie legt einen kleinen Schlüssel auf den Schreibtisch. »Jakob. Und der hängt seit Donnerstagmittag bei uns am Haken. Er hatte ihn vergessen.«"
        do:
          - learn: clue_schluessel
          - move: { object: spindschluessel, to: inventory }
        options:
          - id: an_annehmen
            text: "»Ich übernehme den Fall.«"
            goto: an_bezahlung
      an_bezahlung:
        say: "Sie schiebt dir ein Bündel Scheine hin. »Zweihundert Reichsmark. Ab morgen ist es Papier, also nehmen Sie es heute. Den Rest brauch ich Sonntag an der Kartenstelle: vierzig für mich, vierzig für Lotte, vierzig für Jakob.«"
        do:
          - move: { object: reichsmark, to: inventory }
          - set: auftrag_angenommen
          - move: { object: anni, to: nissenhuette }
        options:
          - id: an_abschied
            text: "»Ich finde ihn, Frau Brodersen.«"
            do:
              - say: "»Fragen Sie Tadeusz am Zollkanal. Jakobs Freund. Ich bin in der Siedlung, Hütte 14.« Dann ist sie fort. Auf dem Besucherstuhl bleibt ein nasser Fleck."

  # -------------------------------------------------------------------------
  # P6: Annis Blechdose. Default dialogue of anni (in nissenhuette).
  # Also started by rule show_lene_anni.
  # -------------------------------------------------------------------------
  anni_huette:
    with: anni
    start: ah_hub
    nodes:
      ah_hub:
        say:
          - when: { has: clue_schweigegeld }
            text: "Anni lässt die Nadel sinken. »Haben Sie ihn gefunden, Voss?«"
          - text: "»Und? Haben Sie was?« Die Nadel geht weiter durch den Stoff."
        options:
          - id: ah_kuvert
            text: "»Kröger war Freitagabend hier. Mit einem Kuvert.«"
            when:
              - has: clue_lene
              - not: { has: clue_schweigegeld }
            goto: ah_kuvert
          - id: ah_lebt
            text: "»Jakob lebt, Frau Brodersen.«"
            when: { has: clue_gestaendnis }
            goto: ah_lebt
          - id: ah_lotte
            text: "»Wie geht es Lotte?«"
            goto: ah_lotte
          - id: ah_tschuess
            text: "»Ich melde mich.«"
      ah_kuvert:
        say: "Lange sagt sie nichts. Dann holt sie die Blechdose vom Bord. Darin ein leeres Kuvert mit Stempel: ›A. & Co. · Speicher K‹. »Zweihundert Reichsmark. ›Von der Kolonne‹, hat er gesagt.«"
        do:
          - learn: clue_schweigegeld
          - score: 1
        options:
          - id: ah_warum
            text: "»Und wo ist das Geld jetzt?«"
            goto: ah_warum
      ah_warum:
        say:
          - when: { has: reichsmark }
            text: "»In Ihrer Tasche, Voss. Ich hab Sie davon bezahlt. Wenn es schon Schweigegeld ist, soll es wenigstens für Jakob reden.«"
          - text: "»Ich hab Sie davon bezahlt, Voss. Wo es jetzt ist, will ich nicht wissen. Wenn es schon Schweigegeld ist, soll es wenigstens für Jakob reden.«"
        options:
          - id: ah_gehen
            text: "»Das wird es.«"
      ah_lebt:
        say:
          - when: { has: clue_jakob_aussage }
            text: "Anni legt die Nadel weg. »Haben Sie ihn gesehen?« Du nickst und richtest aus: Er hat richtig gezählt. Sie nickt, als hätte sie nie etwas anderes geglaubt."
          - text: "Anni legt die Nadel weg, sehr langsam. »Dann holen Sie ihn nach Hause. Was stehen Sie hier noch rum?« Sie dreht sich zur Wand, damit du ihr Gesicht nicht siehst."
        # No options: the scene ends on Anni's gesture.
      ah_lotte:
        say: "»Sie schläft. Wer schläft, hat keinen Hunger.«"
        options:
          - id: ah_zurueck
            text: "»Verstehe.«"
            goto: ah_hub

  # -------------------------------------------------------------------------
  # P7: Das Verhör. Default dialogue of kroeger (in kneipe).
  # Progress: counter kroeger_stufe 0..4, set only here. A wrong piece of
  # evidence gets a rebuttal and returns to the same stage node.
  # -------------------------------------------------------------------------
  kroeger_verhoer:
    with: kroeger
    start: k_hub
    nodes:
      k_hub:
        say:
          - when: { has: clue_gestaendnis }
            text: "Kröger dreht sein leeres Glas. »Was wollen Se noch? Ich hab alles gesagt.«"
          - when: { counter: { name: kroeger_stufe, gte: 1 } }
            text: "Kröger sieht dich kommen und dreht das Glas weg. »Se geben wohl nie auf, Voss.«"
          - when: { has: clue_kroeger_version }
            text: "»Na, Voss. Noch 'ne Runde?« Kröger schiebt dir keinen Stuhl hin."
          - text: "Kröger mustert dich über seinen Köm hinweg. »Die Spürnase von der Brodersen. Hundertachtzig Kisten, sauber gezählt, der Rest is Schwund. Brodersen hat um Mitternacht Schluss gemacht. Im Spind lag die Ware. Mit seiner Frau hab ich nix zu schaffen.«"
        do:
          - learn: clue_kroeger_version
        options:
          - id: k_verhoer1
            text: "»Reden wir über Donnerstagnacht.«"
            when: { counter: { name: kroeger_stufe, eq: 0 } }
            goto: k_s1
          - id: k_verhoer2
            text: "»Weiter, Kröger. Brodersens Feierabend.«"
            when: { counter: { name: kroeger_stufe, eq: 1 } }
            goto: k_s2
          - id: k_verhoer3
            text: "»Weiter. Der Spind.«"
            when: { counter: { name: kroeger_stufe, eq: 2 } }
            goto: k_s3
          - id: k_verhoer4
            text: "»Weiter. Die Brodersens.«"
            when: { counter: { name: kroeger_stufe, eq: 3 } }
            goto: k_s4
          - id: k_weg
            text: "»Wie komme ich zu Jakob?«"
            when: { has: clue_gestaendnis }
            goto: k_weg
          - id: k_tschuess
            text: "»Prost, Kröger.«"

      # Stage 1: Schwund. Valid: clue_kein_schwund (D5).
      k_s1:
        say: "»Was fehlt, is Schwund. Im Hafen schwindet immer was. Kisten, Kaffee – Leute.«"
        options:
          - id: k_s1_zwanzig
            text: "»Zwanzig Kisten fehlen. Und Sie haben gezählt.«"
            when: { has: clue_zwanzig_kisten }
            do:
              - say: "Kröger grinst. »Und wo solln die hin sein? Ins Hafenbecken?«"
            goto: k_s1
          - id: k_s1_lene
            text: "»Sie haben Lene Zigaretten verkauft.«"
            when: { has: clue_lene }
            do:
              - say: "»'n paar Stangen. Was hat das mit meiner Zählung zu tun?«"
            goto: k_s1
          - id: k_s1_kein_schwund
            text: "»Kein Schwund. Lene verkauft Ihr Los 4471.«"
            when: { has: clue_kein_schwund }
            do:
              - say: "Kröger setzt das Glas an und trinkt doch nicht. »Lene redet viel, wenn der Tag lang is.«"
              - counter: { name: kroeger_stufe, set: 1 }
              - score: 1
            goto: k_s2
          - id: k_s1_heft
            text: "»Jakobs Heft sagt: zwanzig Kisten in die ›Elise 7‹.«"
            when: { has: clue_zaehlheft }
            do:
              - say: "»Da steht K. Und geschrieben hat's 'n Dieb.«"
            goto: k_s1
          - id: k_s1_raus
            text: "»Ein andermal.«"

      # Stage 2: Mitternacht Schluss. Valid: clue_zaehlheft (P5).
      k_s2:
        say: "Kröger lehnt sich zurück. »Brodersen hat um Mitternacht Schluss gemacht. Danach weiß ich nix.«"
        options:
          - id: k_s2_tally
            text: "»Ihr Tallyzettel sagt hundertachtzig.«"
            when: { has: clue_tally }
            do:
              - say: "»Eben. Steht da was von Brodersen?«"
            goto: k_s2
          - id: k_s2_heft
            text: "»Sein Zählheft sagt: letzte Hieve um 01:20.«"
            when: { has: clue_zaehlheft }
            do:
              - say: "Kröger dreht das Glas einmal um sich selbst. »Brodersen und sein Heft. Der zählt sogar die Möwen.«"
              - counter: { name: kroeger_stufe, set: 2 }
              - score: 1
            goto: k_s3
          - id: k_s2_raus
            text: "»Ein andermal.«"

      # Stage 3: Dieb bleibt Dieb. Valid: clue_untergeschoben (D4).
      # Each half of D4 alone gets a rebuttal that names the other half.
      k_s3:
        say: "»Dieb bleibt Dieb. Ich hab den Spind selbst aufgeschlossen. Vor der Polizei.«"
        options:
          - id: k_s3_frisch
            text: "»Die Ware kam erst Donnerstagnacht an Land.«"
            when: { has: clue_frisch_an_land }
            do:
              - say: "»Na und? Er war ja Donnerstagnacht an Bord.«"
            goto: k_s3
          - id: k_s3_nur
            text: "»Seit Donnerstagmittag passte nur noch Ihr Schlüssel.«"
            when: { has: clue_nur_kroeger }
            do:
              - say: "»Und vorher hatte er seinen. Kann das Zeug schon Mittwoch reingelegt haben.«"
            goto: k_s3
          - id: k_s3_untergeschoben
            text: "»Sie haben ihm die Stangen untergeschoben.«"
            when: { has: clue_untergeschoben }
            do:
              - say: "Zum ersten Mal sagt Kröger nichts. Zwei Tische weiter hört seine Kolonne auf zu reden."
              - counter: { name: kroeger_stufe, set: 3 }
              - score: 1
            goto: k_s4
          - id: k_s3_raus
            text: "»Ein andermal.«"

      # Stage 4: Nix mit den Brodersens. Valid: clue_schweigegeld (P6).
      k_s4:
        say: "Kröger wird laut. »Ich hab mit den Brodersens nix zu schaffen! Seine Frau kenn ich kaum.«"
        options:
          - id: k_s4_lene
            text: "»Lene hat Sie Freitag bei den Brodersens gesehen.«"
            when: { has: clue_lene }
            do:
              - say: "»Kondoliert hab ich. Als Vorarbeiter. Is das verboten?«"
            goto: k_s4
          - id: k_s4_heft
            text: "»Im Heft steht ›K.‹ – K wie Kröger.«"
            when: { has: clue_zaehlheft }
            do:
              - say: "»K wie Kran. K wie Kai. Lesen Se mal ein Hafenheft.«"
            goto: k_s4
          - id: k_s4_kuvert
            text: "»Sie haben Anni zweihundert Reichsmark gebracht.«"
            when: { has: clue_schweigegeld }
            do:
              - counter: { name: kroeger_stufe, set: 4 }
            goto: k_gestaendnis
          - id: k_s4_raus
            text: "»Ein andermal.«"

      # Confession: linear, ends with the only optional toggle (kroeger_zeuge).
      k_gestaendnis:
        say: "Kröger starrt in sein Glas. Lange. »Ich wollt ihn nicht schubsen. Er is auf der Lukentreppe ausgerutscht, das Bein war ab. Ich wollt 'n Arzt holen.« Er schluckt. »Seitdem bring ich ihm jeden Abend Wasser. Jeden Abend.«"
        do:
          - learn: clue_gestaendnis
          - score: 2
        options:
          - id: k_g_wo
            text: "»Wo ist er, Kröger?«"
            goto: k_wo
      k_wo:
        say: "»Speicher K. Vierter Boden.« Er legt einen Schlüssel auf den Tisch, dann ein gefaltetes Papier. »Das hat Asmussen mir geschrieben. Persilschein. Ohne den Wisch bin ich wieder der Kröger von dreiunddreißig.«"
        do:
          - move: { object: bodenschluessel, to: inventory }
          - learn: clue_persilschein
        options:
          - id: k_g_weiter
            text: "»Und die Brücke? Nachts ist sie zu.«"
            goto: k_boot
      k_boot:
        say: "»Ich nehm jeden Abend das Boot vom Wächter am Zollkanal. Der sieht weg. Der sieht immer weg.« Kröger hebt den Kopf. »Was wird jetzt aus mir?«"
        options:
          - id: k_g_zeuge
            text: "»Sagen Sie gegen Asmussen aus. Dann sag ich für Sie aus.«"
            do:
              - set: kroeger_zeuge
              - say: "Kröger nickt einmal, wie beim Verladen."
          - id: k_g_richter
            text: "»Das entscheidet ein Richter.«"
            do:
              - say: "Kröger nickt. Er hat nichts anderes erwartet."
      k_weg:
        say: "»Übers Wasser. Fragen Se den Wächter am Zollkanal.« Er sieht auf seine Hände. »Und sagen Se Brodersen …« Er bricht ab. »Ach, lassen Se's.«"

  # -------------------------------------------------------------------------
  # Forced scene at the Baumwall. Started by enter rule asmussen_hinterhalt.
  # Strictly linear, adds no optional state.
  # -------------------------------------------------------------------------
  asmussen_warnung:
    with: asmussen
    start: a_w_start
    nodes:
      a_w_start:
        say: "Ein Mann im Kamelhaarmantel tritt aus dem Regen. Sein Hut ist der einzige trockene in Hamburg. Er reicht dir eine Karte. »Voss? Asmussen, Kaffee-Import. Sie haben vor dem Krieg meine Ladungen versichert. Jetzt fragen Sie im Hafen herum.«"
        do:
          - learn: clue_asmussen
        options:
          - id: a_w_wer
            text: "»Kennen Sie Jakob Brodersen?«"
            goto: a_w_geld
      a_w_geld:
        say: "»Ich kenne keinen Brodersen. Und Speicher K ist seit dreiundvierzig eine Ruine, da lagert niemand etwas.« Er zählt Scheine ab. »Fünfhundert Reichsmark. Für Ihre Mühe. Gehen Sie nach Hause, Voss.«"
        options:
          - id: a_w_ablehnen
            text: "»Behalten Sie's. Ab morgen ist es Altpapier.«"
            do:
              - move: { object: asmussen, to: kontor }
              - say: "Er lächelt, als kenne er den Witz schon. »Wie Sie meinen.« Der Mantel verschwindet Richtung Speicherstadt."

  # -------------------------------------------------------------------------
  # P4b: the backyard. Default dialogue of lene (in hinterhof).
  # Same result as the rules show_paeckchen_lene / show_los_lene.
  # -------------------------------------------------------------------------
  lene_gespraech:
    with: lene
    start: l_hub
    nodes:
      l_hub:
        say:
          - when: { has: clue_lene }
            text: "»Ich hab dir alles gesagt. Und ein bisschen mehr.« Lene zählt Feuersteine ab, als wärst du schon weg."
          - text: "»Feuersteine, Nähnadeln, gute Ratschläge. Die Ratschläge kosten extra.«"
        options:
          - id: l_zigaretten
            text: "»Haben Sie auch Zigaretten?«"
            when: { not: { has: clue_lene } }
            goto: l_luege
          - id: l_los
            text: "»Und was ist hiermit? Los 4471.«"
            when:
              - has: zigarettenpaeckchen
              - not: { has: clue_lene }
            goto: l_redet
          - id: l_montag
            text: "»Was wird aus Ihnen ab Montag?«"
            goto: l_montag
          - id: l_tschuess
            text: "»Schönen Abend noch.«"
      l_luege:
        say: "»Zigaretten? Ich rauch nicht mal.« Unter den Hosenknöpfen in ihrem Bauchladen blitzt eine Banderole."
        options:
          - id: l_zurueck1
            text: "»Natürlich nicht.«"
            goto: l_hub
      l_redet:
        say: "Lene sieht das Päckchen an, dann dich. »Freitag, sechs Uhr früh. Kröger. Fünf Stangen, dieselbe Nummer. ›Der Rest gehört dem Kaffeemann aus der Speicherstadt‹, hat er gesagt.«"
        do:
          - learn: clue_lene
          - score: 1
        options:
          - id: l_und
            text: "»Und weiter?«"
            goto: l_kuvert
      l_kuvert:
        say: "»Am Abend is er bei den Brodersens rein. Mit 'nem Kuvert. Ich wohn drei Hütten weiter, ich seh so was.«"
        options:
          - id: l_zurueck2
            text: "»Danke, Lene.«"
            goto: l_hub
      l_montag:
        say: "»Wart's ab: Am Montag sind die Schaufenster voll. Und keiner fragt, wo das Zeug bis Sonntag war.«"
        options:
          - id: l_zurueck3
            text: "»Wahrscheinlich nicht.«"
            goto: l_hub

  # -------------------------------------------------------------------------
  # P5 and the Act III crossing. Default dialogue of tadeusz (in zollkanal).
  # Also started by rule show_untergeschoben_tadeusz.
  # -------------------------------------------------------------------------
  tadeusz_gespraech:
    with: tadeusz
    start: t_hub
    nodes:
      t_hub:
        say:
          - when: { has: clue_jakob_aussage }
            text: "Tadeusz hält das Boot an der Kaimauer fest. Auf der Ducht stehen zwei Becher Muckefuck. Einer ist für Jakob."
          - when: { flag: tadeusz_rudert }
            text: "Tadeusz hält das Boot an der Kaimauer fest. »Wann immer Sie so weit sind, Voss.«"
          - when: { has: clue_zaehlheft }
            text: "Die Thermoskanne steht offen. Tadeusz hat dir einen Becher eingeschenkt."
          - text: "Tadeusz hält die zugeschraubte Thermoskanne auf den Knien, als wäre das Gespräch damit beendet."
        options:
          - id: t_jakob
            text: "»Sie sind Jakobs Freund.«"
            when: { not: { has: clue_zaehlheft } }
            goto: t_jakob
          - id: t_kein_dieb
            text: "»Jakob ist kein Dieb. Ich kann es beweisen.«"
            when:
              - has: clue_untergeschoben
              - not: { has: clue_zaehlheft }
            goto: t_heft
          - id: t_ueberfahrt
            text: "»Jakob lebt. Speicher K, vierter Boden.«"
            when:
              - has: clue_gestaendnis
              - not: { flag: tadeusz_rudert }
            do:
              - set: tadeusz_rudert
            goto: t_rudern
          - id: t_halina
            text: "»Worauf warten Sie, Tadeusz?«"
            goto: t_halina
          - id: t_tschuess
            text: "»Gute Nacht, Tadeusz.«"
      t_jakob:
        say: "»Wir trinken jede Nacht zusammen Muckefuck, seit einem Jahr. Seit Donnerstag trinke ich allein.« Er sieht aufs Wasser. »Wenn Jakob ein Dieb ist, bin ich der Freund eines Diebes. Wenn nicht … dann ist das etwas anderes.«"
        options:
          - id: t_zurueck1
            text: "»Verstehe.«"
            goto: t_hub
      t_heft:
        say: "Er hört zu, ohne zu nicken. Dann holt er ein Heft aus der Wachbude. »Von Jakob. Um halb zwei. ›Wenn ich bis morgen nicht zurück bin, gib es Anni.‹ Ich habe es nicht gegeben.«"
        do:
          - learn: clue_zaehlheft
          - score: 1
        options:
          - id: t_wohin
            text: "»Wohin ist er gegangen?«"
            goto: t_elise
      t_elise:
        say: "»Hinter der Schute ›Elise 7‹ her, am Kanal entlang. Im Register steht, wem sie gehört: A. & Co., Speicher K.«"
        options:
          - id: t_angst
            text: "»Warum haben Sie geschwiegen?«"
            goto: t_dp
      t_dp:
        say: "»Am Freitag hat die Polizei ›die Polen‹ befragt. Für Ihre Polizei bin ich ein DP, ein Mensch am falschen Ort. Und wer am falschen Ort ist, hat immer etwas gestohlen.«"
        options:
          - id: t_danke
            text: "»Danke, Tadeusz.«"
      t_rudern:
        say: "Tadeusz steht auf. »Kröger nimmt jeden Abend mein Boot. Ich habe weggesehen. Ich habe fünf Jahre gelernt, nichts zu sehen.« Er macht das Boot los. »Die Brücke ist zu. Das Wasser nicht.«"
      t_halina:
        say: "»Auf Papiere. Kanada, als Holzfäller. Und auf einen Namen auf einer Suchliste: Halina Wrona, meine Schwester.« Er lächelt kaum. »Sie suchen einen Mann, ich suche eine Schwester. Wir haben beide nur Papier in der Hand.«"
        options:
          - id: t_zurueck2
            text: "»Ich hoffe, Sie finden sie.«"
            goto: t_hub

  # -------------------------------------------------------------------------
  # P8: the rescue. Default dialogue of jakob (in vierter_boden).
  # On the first talk j_was is the only option, so the testimony is certain.
  # -------------------------------------------------------------------------
  jakob_gespraech:
    with: jakob
    start: j_start
    nodes:
      j_start:
        say:
          - when: { has: clue_jakob_aussage }
            text: "»Bringen Sie's zu Ende, Voss. Ich zähl solange die Tropfen vom Dach.«"
          - text: "Der Mann am Pfeiler hebt die Hand gegen das Licht. »Zweihundert«, sagt er. »Ich hab zweihundert gezählt. Ich zähl immer.«"
        options:
          - id: j_was
            text: "»Was ist passiert, Jakob?«"
            when: { not: { has: clue_jakob_aussage } }
            goto: j_was
          - id: j_tschuess
            text: "»Ich hole Sie hier raus.«"
            when: { has: clue_jakob_aussage }
      j_was:
        say: "»Kröger hat mich oben an der Luke erwischt. Ich bin die Treppe runter. Dann kam einer im Kamelhaarmantel. Kröger wollte 'n Arzt holen. Der Mantel hat gesagt: ›Kein Arzt. Ärzte reden.‹«"
        do:
          - learn: clue_jakob_aussage
          - score: 1
        options:
          - id: j_durchhalten
            text: "»Halten Sie durch. Heute Nacht noch.«"
            goto: j_ende
      j_ende:
        say: "»Grüßen Sie Anni. Sagen Sie ihr, ich hab richtig gezählt.«"

  # -------------------------------------------------------------------------
  # Finale: Die Abrechnung. Default dialogue of asmussen (in kontor).
  # Stateless ladder: three rungs, one valid proof each. Leaving restarts at
  # rung 1. Points only in the final choice.
  # -------------------------------------------------------------------------
  asmussen_finale:
    with: asmussen
    start: f_start
    nodes:
      f_start:
        say: "Asmussen sieht nicht auf. »Voss. Sie tropfen auf meinen Teppich.«"
        options:
          - id: f_anklage
            text: "»Ich war oben, Asmussen. Vierter Boden.«"
            goto: f_s1
          - id: f_gehen
            text: "»Ein andermal.«"

      # Rung 1: »Ich kenne den Mann kaum.« Valid: clue_persilschein.
      f_s1:
        say: "»Kröger? Ein Vorarbeiter unter Hunderten. Ich kenne den Mann kaum.«"
        options:
          - id: f_s1_kuvert
            text: "»Ihr Kuvert lag bei Anni Brodersen.«"
            when: { has: clue_schweigegeld }
            do:
              - say: "»Kuverts mit meinem Stempel liegen im Hafen zu Hunderten herum.«"
            goto: f_s1
          - id: f_s1_persil
            text: "»›Ich kenne Herrn Kröger seit 1934.‹ Ihr Persilschein.«"
            when: { has: clue_persilschein }
            do:
              - say: "»Persilschein. Ein hässliches Wort. Ich nenne es: für einen Mitarbeiter gebürgt.«"
            goto: f_s2
          - id: f_s1_jakob
            text: "»Jakob hat Sie gesehen.«"
            when: { has: clue_jakob_aussage }
            do:
              - say: "»Ein Mann im Fieber sieht einen Mantel.«"
            goto: f_s1
          - id: f_gehen1
            text: "»Ein andermal.«"

      # Rung 2: »Hinter meinem Rücken.« Valid: clue_dieselbe_hand (D6).
      f_s2:
        say: "Asmussen faltet die Hände. »Wenn oben Ware liegt, hat Kröger sie versteckt. Hinter meinem Rücken.«"
        options:
          - id: f_s2_elise
            text: "»Ihre Schute hat die Kisten gebracht.«"
            when: { has: clue_zaehlheft }
            do:
              - say: "»Meine Schute fährt für jeden, der zahlt.«"
            goto: f_s2
          - id: f_s2_zettel
            text: "»Oben lag Ihre Anweisung an Kröger.«"
            when: { has: clue_anweisung }
            do:
              - say: "Asmussen lächelt. »Ohne Unterschrift? Die kann jeder geschrieben haben.«"
            goto: f_s2
          - id: f_s2_hand
            text: "»›Montag sechs Uhr geht die Ware raus.‹ Ihre Tinte. Ihr ›g‹.«"
            when: { has: clue_dieselbe_hand }
            do:
              - say: "Asmussen stellt die Tasse ab. Zum ersten Mal sieht er dich an."
            goto: f_s3
          - id: f_gehen2
            text: "»Ein andermal.«"

      # Rung 3: »Ich habe ihm das Leben gerettet.« Valid: clue_jakob_aussage.
      f_s3:
        say: "»Ich habe Ware zurückgehalten, wie jeder Kaufmann diese Woche. Und ohne mich läge Brodersen im Fleet. Ich habe ihm das Leben gerettet.«"
        options:
          - id: f_s3_spind
            text: "»Sie haben Jakob zum Dieb gemacht.«"
            when: { has: clue_untergeschoben }
            do:
              - say: "»Kröger hat ihm die Stangen untergeschoben, nicht ich. Lesen Sie Ihre eigenen Notizen.«"
            goto: f_s3
          - id: f_s3_kisten
            text: "»Zwanzig Kisten NAAFI-Ware hält man nicht zurück.«"
            when: { has: clue_zwanzig_kisten }
            do:
              - say: "»Die Engländer bekommen ihre Kisten. Mit Zinsen, wenn Sie wollen.«"
            goto: f_s3
          - id: f_s3_arzt
            text: "»Kröger wollte einen Arzt holen. Sie haben Nein gesagt.«"
            when: { has: clue_jakob_aussage }
            goto: f_angebot
          - id: f_gehen3
            text: "»Ein andermal.«"

      # The bribe and the refusal. The refrain is used here and nowhere else.
      f_angebot:
        say: "Asmussen schweigt eine Weile. »Zwei Sack Rohkaffee, Voss. Ab Montag mehr wert als Ihr ganzes Büro.« Er lehnt sich zurück. »Sie haben vor dem Krieg meine Ladungen versichert. Damals haben Sie auch nicht gefragt, woher die Ware kam.«"
        options:
          - id: f_ablehnen
            text: "»Geld kann man umtauschen. Schuld nicht.«"
            goto: f_wahl
      f_wahl:
        say: "Draußen wird der Regen grau. Asmussen greift nach dem Telefon und lässt die Hand dann liegen. »Und jetzt? Wem wollen Sie mich verkaufen?«"
        options:
          - id: f_englaender
            text: "»Den Engländern. Es ist ihre Ware.«"
            do:
              - score: 4
              - end: ende_erster_morgen
          - id: f_kripo
            text: "»Der Kripo. Es ist unsere Stadt.«"
            do:
              - score: 4
              - end: ende_hamburger_regen
