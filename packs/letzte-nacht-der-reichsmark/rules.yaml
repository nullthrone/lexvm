  - id: give_reichsmark_wirt
    on: { verb: give, object: reichsmark, with: wirt }
    when: { not: { flag: hintertuer_frei } }
    do:
      - say: Du legst Annis Bündel auf den Tresen. Der Wirt wiegt es in der Hand, statt zu zählen, und zum ersten Mal an diesem Abend lächelt er. »Zweihundert, schätz ich. Damit zahl ich der Brauerei meine Schulden, in Altpapier, und bis Sonntag müssen die’s noch nehmen.« Er nickt zur Hintertür. »Geh’n Se ruhig durch.« Das einzige Geld in Hamburg, das heute noch jemandem nützt, ist das Honorar für deinen Fall.
      - move: { object: reichsmark, to: nowhere }
      - set: hintertuer_frei
      - score: 1

  - id: bezahlen_kroeger
