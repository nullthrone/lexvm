  # -------------------------------------------------------------------------
  - id: open_zollgitter
    on: { verb: open, object: zollgitter }
    do:
      - say: Die Kette ist dicker als dein Handgelenk.

  - id: use_zollgitter
    on: { verb: use, object: zollgitter }
    do:
      - say: Die Kette ist dicker als dein Handgelenk.

  - id: laterne_anzuenden
    on: { verb: use, object: streichhoelzer, with: sturmlaterne }
    when: { not: { flag: laterne_an } }
    do:
      - say: Der Docht fängt beim zweiten Streichholz. Du hebst die Laterne an, und gelbes Licht fällt auf schwarze Stufen, auf Ruß an den Wänden und auf frische Fußspuren im Staub, immer dieselben Stiefel, hinauf und wieder hinunter. Jemand geht diese Treppe jeden Abend.
      - set: laterne_an
      - move: { object: sturmlaterne, to: inventory }

  - id: laterne_brennt
    on: { verb: use, object: streichhoelzer, with: sturmlaterne }
    do:
      - say: Sie brennt schon.

  # »zünde die Laterne an«, or »Benutzen« on the lantern: the matches are in
  # your pocket anyway (they can't be dropped).
  - id: laterne_anzuenden_kurz
    on: { verb: use, object: sturmlaterne }
    when:
      - { not: { flag: laterne_an } }
      - { has: streichhoelzer }
    do:
      - say: Der Docht fängt beim zweiten Streichholz. Du hebst die Laterne an, und gelbes Licht fällt auf schwarze Stufen, auf Ruß an den Wänden und auf frische Fußspuren im Staub, immer dieselben Stiefel, hinauf und wieder hinunter. Jemand geht diese Treppe jeden Abend.
      - set: laterne_an
      - move: { object: sturmlaterne, to: inventory }

  - id: laterne_brennt_kurz
    on: { verb: use, object: sturmlaterne }
    when: { flag: laterne_an }
    do:
      - say: Sie brennt schon.

  - id: bodentuer_dunkel
    on: { verb: open, object: bodentuer }
    when: { not: { flag: laterne_an } }
    do:
      - say:
          - when: { has: sturmlaterne }
            text: Im Dunkeln findest du das Schlüsselloch nicht. Die Laterne in deiner Hand nützt nichts, solange sie nicht brennt.
          - text: Im Dunkeln findest du das Schlüsselloch nicht. Auf dem Absatz stand doch eine Laterne.

  - id: bodentuer_dunkel_use
    on: { verb: use, object: bodenschluessel, with: bodentuer }
    when: { not: { flag: laterne_an } }
    do:
      - say:
          - when: { has: sturmlaterne }
            text: Im Dunkeln findest du das Schlüsselloch nicht. Die Laterne in deiner Hand nützt nichts, solange sie nicht brennt.
          - text: Im Dunkeln findest du das Schlüsselloch nicht. Auf dem Absatz stand doch eine Laterne.

  - id: bodentuer_auf
    on: { verb: open, object: bodentuer }
    when:
      - { flag: laterne_an }
      - { isLocked: bodentuer }
      - { has: bodenschluessel }
    do:
      - unlock: bodentuer
      - open: bodentuer
      - say: "Krögers Schlüssel passt, natürlich. Das Schloss ist geölt, das einzige Ding in diesem Haus, das jemand pflegt, und die Tür schwingt lautlos nach innen auf. Von oben kommt warme, abgestandene Luft und ein Geräusch, das du erst nach einem Moment erkennst: Jemand zählt, leise und ohne Fehler."
      - score: 1

  - id: bodentuer_auf_use
    on: { verb: use, object: bodenschluessel, with: bodentuer }
    when:
      - { flag: laterne_an }
      - { isLocked: bodentuer }
    do:
      - unlock: bodentuer
      - open: bodentuer
      - say: "Krögers Schlüssel passt, natürlich. Das Schloss ist geölt, das einzige Ding in diesem Haus, das jemand pflegt, und die Tür schwingt lautlos nach innen auf. Von oben kommt warme, abgestandene Luft und ein Geräusch, das du erst nach einem Moment erkennst: Jemand zählt, leise und ohne Fehler."
      - score: 1

  - id: close_bodentuer
    on: { verb: close, object: bodentuer }
    do:
      - say: Du lässt sie offen. Hinter dieser Tür war lange genug zu.

  - id: horchen_bodentuer
    on: { verb: horchen, object: bodentuer }
    do:
      - say:
          - when: { isOpen: bodentuer }
            text: Von oben hörst du Jakob zählen. Leise, aber ohne Fehler.
          - text: Oben ist es still. Dann ein Husten, sehr leise.

  # The Kontor opens with every proof in hand, like exit speicher_treppe.down.
  - id: open_kontortuer_frei
    on: { verb: open, object: kontortuer }
    when:
      - { has: clue_jakob_aussage }
      - { has: clue_dieselbe_hand }
    do:
      - say: Du hast, was du brauchst. Die Tür ist nur angelehnt, als erwarte da unten jemand Besuch. Drei Stufen tiefer brennt Licht, und es riecht nach Bohnenkaffee.
      - goto: kontor

  - id: open_kontortuer_beweis
    on: { verb: open, object: kontortuer }
    when: { has: clue_jakob_aussage }
    do:
      - say:
          - when: { not: { has: clue_anweisung } }
            text: Du legst die Hand auf die Klinke und zögerst. Asmussen wird alles abstreiten. Hast du oben wirklich alles gesehen?
          - text: Du legst die Hand auf die Klinke und zögerst. Asmussen wird alles abstreiten. Wer hat die Anweisung geschrieben? Die Antwort steckt schon in deinem Notizbuch.

  - id: open_kontortuer
    on: { verb: open, object: kontortuer }
    do:
      - say: Asmussen kann warten. Erst Jakob.

  - id: horchen_kontortuer
    on: { verb: horchen, object: kontortuer }
    do:
      - say: Eine Tasse klirrt. Papier raschelt. Wer da unten sitzt, hat keine Eile.

  - id: use_streichhoelzer_kisten
    on: { verb: use, object: streichhoelzer, with: kisten }
    do:
      - say: Feuer in einem Speicher? Hamburg hat genug gebrannt.

  - id: use_streichhoelzer_kaffeesaecke
    on: { verb: use, object: streichhoelzer, with: kaffeesaecke }
    do:
      - say: Feuer in einem Speicher? Hamburg hat genug gebrannt.

  - id: use_streichhoelzer_zettel
    on: { verb: use, object: streichhoelzer, with: zettel }
    do:
      - say: Beweise verbrennt man nicht. Das machen andere.

  - id: take_kisten
    on: { verb: take, object: kisten }
    do:
      - say: Zwanzig Kisten. Du hast zwei Hände.

  - id: zaehlen_kisten
    on: { verb: zaehlen, object: kisten }
    do:
      - say: Zwanzig. Genau die zwanzig, die auf Krögers Zählzettel fehlen.

  - id: zaehlen_reichsmark
    on: { verb: zaehlen, object: reichsmark }
    do:
      - say: Zweihundert. Du zählst ein zweites Mal. Ab Montag ist es egal, wie oft man zählt.

  - id: take_jakob
    on: { verb: take, object: jakob }
    do:
      - say: Mit dem Bein? Nicht ohne Trage. Und nicht ohne Arzt.

  - id: helfen_jakob
    on: { verb: helfen, object: jakob }
    do:
      - say: Allein kriegst du ihn nicht die Treppe hinunter, nicht mit dem Bein. Erst Asmussen, dann ein Arzt.

  # -------------------------------------------------------------------------
  # Finale: Kontor Asmussen
  # -------------------------------------------------------------------------
  - id: take_kaffeetasse
    on: { verb: take, object: kaffeetasse }
    do:
      - say: Asmussen hebt eine Augenbraue. Das reicht.

  - id: take_fuellhalter
    on: { verb: take, object: fuellhalter }
    do:
      - say: Asmussen hebt eine Augenbraue. Das reicht.

  # -------------------------------------------------------------------------
  # Catch-alls per character (after every specific give/show rule)
  # -------------------------------------------------------------------------
  - id: show_anni
    on: { verb: show, with: anni }
    do:
      - say: "»Ich versteh nichts von Kisten, Voss. Ich versteh was von Jakob.«"

  - id: give_anni
    on: { verb: give, with: anni }
    do:
      - say: "»Behalten Sie das.«"

  - id: show_paeckchen_kroeger
    on: { verb: show, object: zigarettenpaeckchen, with: kroeger }
    do:
      - say:
          - when: { has: clue_gestaendnis }
            text: Kröger sieht weg. »Stecken Se das ein. Ich hab alles gesagt.«
          - when: { has: clue_kroeger_version }
            text: Kröger sieht kurz hin, dann in sein Glas. »Englische. Gibt’s an jeder Ecke.«
          - text: Der Mann sieht kurz hin, dann in sein Glas. »Englische. Gibt’s an jeder Ecke.«

  - id: show_kroeger
    on: { verb: show, with: kroeger }
    do:
      - say:
          - when: { has: clue_kroeger_version }
            text: Kröger sieht nicht hin. »Wenn Se was wollen, reden Se mit mir.«
          - text: Der Mann sieht nicht hin. »Wenn Se was wollen, reden Se mit mir.«

  - id: give_kroeger
    on: { verb: give, with: kroeger }
    do:
      - say: "»Behalten Se das.«"

  - id: show_wirt
    on: { verb: show, with: wirt }
    do:
      - say: "»Zeigen nützt nix.«"

  - id: give_wirt
    on: { verb: give, with: wirt }
    do:
      - say: "»Behalten Se das.«"

  - id: show_lene_wieder
    on: { verb: show, object: zigarettenpaeckchen, with: lene }
    do:
      - say: "»Hab ich dir doch alles erzählt. Steck das weg, bevor’s einer sieht.«"

  - id: show_lene
    on: { verb: show, with: lene }
    do:
      - say: "»Zeigen kostet nix. Kaufen schon.«"

  - id: give_lene
    on: { verb: give, with: lene }
    do:
      - say: "»Ich nehm nix, was ich nicht verkaufen kann.«"

  - id: show_tadeusz
    on: { verb: show, with: tadeusz }
    do:
      - say:
          - when: { has: clue_zaehlheft }
            text: Tadeusz schüttelt den Kopf. »Das müssen Sie nicht mir zeigen, Voss.«
          - when: { flag: kennt_tadeusz }
            text: Tadeusz sieht hin und wieder weg. »Ich habe gelernt, nichts zu sehen.«
          - text: Der Wächter sieht hin und wieder weg. »Ich habe gelernt, nichts zu sehen.«

  - id: give_tadeusz
    on: { verb: give, with: tadeusz }
    do:
      - say: "»Behalten Sie das.«"

  - id: show_jakob
    on: { verb: show, with: jakob }
    do:
      - say: Jakob blinzelt ins Licht. »Reden Sie mit mir, Voss. Ich seh nicht mehr gut.«

  - id: give_jakob
    on: { verb: give, with: jakob }
    do:
      - say: "»Behalten Sie das.«"

  - id: show_asmussen
    on: { verb: show, with: asmussen }
    do:
      - say: Asmussen sieht nicht einmal hin. »Ich kaufe nichts, Voss.«

  - id: give_asmussen
    on: { verb: give, with: asmussen }
    do:
      - say: Asmussen rührt es nicht an. »Behalten Sie das, Voss.«
