            text: Kröger hat gestanden. Seine Behauptungen sind erledigt.
          - text: Krögers Behauptungen widerlegst du nicht im Notizbuch, sondern ihm ins Gesicht. Mit dem passenden Beweis für jede.

  # The notice on the wall is worked with as its notebook entry.
