  # »kauf Zigaretten«, »bezahl Lene«: anything bought in the backyard.
  - id: bezahlen_hinterhof
    on: { verb: bezahlen }
    when: { at: hinterhof }
    do:
      - say:
          - when: { has: clue_lene }
            text: "»Ich verkauf dir nix, Schätzchen. Dein Geld hat der Wirt.«"
          - when: { flag: kennt_lene }
            text: "»Womit denn? Deine Reichsmark hat der Wirt.« Lene mustert dich. »Zeig mir lieber, was du in der Tasche hast.«"
          - text: "»Womit denn? Deine Reichsmark hat der Wirt.« Die Händlerin mustert dich. »Zeig mir lieber, was du in der Tasche hast.«"

  - id: show_reichsmark_wirt
    on: { verb: show, object: reichsmark, with: wirt }
    do:
      - say: "»Zeigen nützt nix. Hergeben.«"

  - id: give_paeckchen_wirt
    on: { verb: give, object: zigarettenpaeckchen, with: wirt }
    do:
      - say: "»Stecken Se das weg. Hier vorne wird nur Bier verkauft.«"

  - id: talk_wirt_frei
    on: { verb: talk, object: wirt }
    when: { flag: hintertuer_frei }
    do:
      - say: "»Hinten is offen. Ab Montag nur noch gegen D-Mark.«"

  - id: talk_wirt
    on: { verb: talk, object: wirt }
    do:
      - say: "»Dünnbier oder Dünnbier?« Der Wirt nickt zur Hintertür. »Da hinten nur Kundschaft, die zahlt. Heut nehm ich sogar noch Reichsmark. Die Brauerei will bis Sonntag ihr Geld.«"

  - id: open_hoftuer_frei
    on: { verb: open, object: hoftuer }
    when: { flag: hintertuer_frei }
    do:
      - say: Die Tür ist nur angelehnt. Der Wirt sieht weg.
      - goto: hinterhof

  - id: open_hoftuer
    on: { verb: open, object: hoftuer }
    do:
      - say: Der Wirt stellt sich vor die Tür. »Da hinten nur Kundschaft, die zahlt.«

  - id: talk_kolonne
    on: { verb: talk, object: kolonne }
    do:
      - say:
          - when: { has: clue_gestaendnis }
            text: Da sitzt keiner mehr.
          - text: Keiner sieht auf. Hier redet der Vorarbeiter.

  - id: give_reichsmark_kroeger
    on: { verb: give, object: reichsmark, with: kroeger }
    do:
      - say: "»Reichsmark? Ab morgen tapezier ich damit.«"

  - id: give_paeckchen_lene
    on: { verb: give, object: zigarettenpaeckchen, with: lene }
    do:
      - say: "»Ein Päckchen? Dafür kriegst du zwei Feuersteine. Und keine Antwort.« Du steckst es wieder ein."

  - id: show_paeckchen_lene
    on: { verb: show, object: zigarettenpaeckchen, with: lene }
    when: { not: { has: clue_lene } }
    do:
      - say: Du hältst ihr das Päckchen hin, die Banderole nach oben. Sie sieht es an, dann dich, und zum ersten Mal hört sie auf zu rechnen. »Freitag, sechs Uhr früh. Kröger. Fünf Stangen, dieselbe Nummer, für einen Preis, der zu gut war.« Sie spricht leise. »›Der Rest gehört dem Kaffeemann aus der Speicherstadt‹, hat er gesagt. Als ob ich das wissen wollte.«
      - say: "»Und am Abend is er bei den Brodersens rein. Mit ’nem Kuvert in der Hand und ’nem Gesicht wie zur Beerdigung. Ich wohn drei Hütten weiter, ich seh so was.« Sie tippt an ihre Schaffnermütze. »Der Ratschlag war umsonst, Schätzchen. Wegen Jakob. Der hat mir mal beim Ofen geholfen.«"
      - if:
          when: { not: { flag: kennt_lene } }
          then:
            - say: "Sie streckt dir die Hand hin, als wäre damit ein Geschäft besiegelt. »Lene. Falls du noch mal was brauchst.«"
            - set: kennt_lene
      - say: Fünf Stangen für Lene, der Rest für einen Kaffeemann. Kröger hat die Ware nicht verloren, er hat sie verteilt. Und hinterher ist er mit einem Kuvert zu der Frau gegangen, deren Mann er zum Dieb gemacht hat. Davon hat Anni dir nichts erzählt.
      - learn: clue_lene
      - score: 1

  - id: show_los_lene
    on: { verb: show, object: clue_los4471, with: lene }
    when: { not: { has: clue_lene } }
    do:
      - say: Sie liest die Nummer in deinem Notizbuch, dann sieht sie dich an, und zum ersten Mal hört sie auf zu rechnen. »Freitag, sechs Uhr früh. Kröger. Fünf Stangen, dieselbe Nummer, für einen Preis, der zu gut war.« Sie spricht leise. »›Der Rest gehört dem Kaffeemann aus der Speicherstadt‹, hat er gesagt. Als ob ich das wissen wollte.«
      - say: "»Und am Abend is er bei den Brodersens rein. Mit ’nem Kuvert in der Hand und ’nem Gesicht wie zur Beerdigung. Ich wohn drei Hütten weiter, ich seh so was.« Sie tippt an ihre Schaffnermütze. »Der Ratschlag war umsonst, Schätzchen. Wegen Jakob. Der hat mir mal beim Ofen geholfen.«"
      - if:
          when: { not: { flag: kennt_lene } }
          then:
            - say: "Sie streckt dir die Hand hin, als wäre damit ein Geschäft besiegelt. »Lene. Falls du noch mal was brauchst.«"
            - set: kennt_lene
      - say: Fünf Stangen für Lene, der Rest für einen Kaffeemann. Kröger hat die Ware nicht verloren, er hat sie verteilt. Und hinterher ist er mit einem Kuvert zu der Frau gegangen, deren Mann er zum Dieb gemacht hat. Davon hat Anni dir nichts erzählt.
      - learn: clue_lene
      - score: 1

  - id: show_tally_lene
    on: { verb: show, object: clue_tally, with: lene }
    do:
      - say: "»Zahlen interessieren mich nur, wenn Geld davorsteht.«"

  - id: take_bauchladen
