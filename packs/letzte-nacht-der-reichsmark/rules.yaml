# yaml-language-server: $schema=../../schema/lexvm-pack-1.schema.json
#
# Game logic. Only the first matching command rule fires, so specific rules
# come before general ones and the per-character catch-alls come last.
# Wrong attempts only print text; every state change is listed in
# design/puzzles.md ("State-changing rules").
rules:
  # -------------------------------------------------------------------------
  # Global
  # -------------------------------------------------------------------------
  - id: drop_im_regen
    on: { verb: drop }
    do:
      - say: Im Regen lässt man nichts liegen. Nicht in Hamburg, 1948.

  # -------------------------------------------------------------------------
  # Act I: Der Auftrag
  # -------------------------------------------------------------------------
  - id: talk_anni_auftrag
    on: { verb: talk, object: anni }
    when: { not: { flag: auftrag_angenommen } }
    do:
      - dialogue: anni_auftrag

  # -------------------------------------------------------------------------
  # Forced event: Asmussen at the Baumwall after the first talk with Kröger
  # -------------------------------------------------------------------------
  - id: asmussen_hinterhalt
    on: { event: enter, room: baumwall }
    when:
      - { has: clue_kroeger_version }
      - { not: { flag: asmussen_getroffen } }
    do:
      - move: { object: asmussen, to: baumwall }
      - set: asmussen_getroffen
      - dialogue: asmussen_warnung

  # -------------------------------------------------------------------------
  # Documents. Looking at them reads them; the parser maps »lies« to look.
  # Bekanntmachung, Kreidetafel and Wachbude show their text as description.
  # -------------------------------------------------------------------------
  - id: look_aushang
    on: { verb: look, object: aushang }
    do:
      - say: |-
          Ein Aushang am Tor, mit Reißzwecken gegen den Wind gehalten. Mit Schreibmaschine getippt, schon etwas aufgeweicht, aber lesbar:
          LADELISTE · Schuppen 17
          Do. 17.6.48, Nachtschicht
          D. Elspeth Gray, NAAFI-Ware, Los 4471: 200 Kisten Zigaretten
          Abtransport NAAFI-Depot Fr. 5 Uhr unter Bewachung
      - say: Die Ladeliste der Nacht, in der Jakob verschwunden ist. Zweihundert Kisten englische Zigaretten, Ware der NAAFI, die die britischen Truppen versorgt. In dieser Stadt ist eine Kiste davon mehr wert als ein Monatslohn. Du schreibst dir die Zahlen ab.
      - learn: clue_loeschliste

  - id: look_zettel
    on: { verb: look, object: zettel }
    do:
      - say: |-
          Ein Zettel, unter die Wasserkanne geklemmt, damit er nicht wegweht. Grüne Tinte, steile Schrift: ›W. – Der Mann bleibt oben. Wasser ja, Licht nein. Montag sechs Uhr geht die Ware raus, dann lass ihn laufen. Wer glaubt schon einem Dieb?‹

          Keine Unterschrift. Jedes »g« hat eine Schleife nach rechts.

          Du liest es zweimal. ›Wer glaubt schon einem Dieb?‹ Das ist der ganze Plan, in einem Satz: Jakob bleibt hier oben, bis die Ware am Montag fort ist, und danach kann er erzählen, was er will. Kröger hat die Anweisung bekommen, nicht geschrieben. Wer schreibt mit grüner Tinte?
      - learn: clue_anweisung

  - id: take_zettel
    on: { verb: take, object: zettel }
    do:
      - say: Du lässt ihn liegen; wer immer den Fall bekommt, soll ihn hier finden. Aber du schreibst ihn ab, Wort für Wort.
      - learn: clue_anweisung

  # -------------------------------------------------------------------------
  # P1: Spind 23. The second paragraph is the first deduction the game
  # points at: two notebook entries that belong together (taught by Anni).
  # -------------------------------------------------------------------------
  - id: open_spind
    on: { verb: open, object: spind_jakob }
    when:
      - { isLocked: spind_jakob }
      - { has: spindschluessel }
    do:
      - unlock: spind_jakob
      - open: spind_jakob
      - move: { object: spindschluessel, to: nowhere }
      - say: "Der Schlüssel dreht sich schwer, dann gibt das Bartschloss nach, und du lässt den Schlüssel stecken. Der Spind ist leer; die Polizei hat mitgenommen, was sie finden wollte. Innen an der Tür steht etwas, schabloniert, wie in jedem dieser Spinde: ›Zweitschlüssel beim Vorarbeiter‹. Und hinter der Rückwand klemmt ein {zigarettenpaeckchen}, das sie übersehen haben."
      - learn: clue_zweitschluessel
      - say: Ein zweiter Schlüssel also, und den hat der Vorarbeiter, Kröger, derselbe Mann, der am Freitag vor dem Kommissar aufgeschlossen hat. Jakobs eigener Schlüssel hing seit Donnerstagmittag zu Hause am Haken. Zwei Einträge in deinem Notizbuch, die zusammengehören.
      - score: 1

  - id: use_schluessel_spind
    on: { verb: use, object: spindschluessel, with: spind_jakob }
    when:
      - { isLocked: spind_jakob }
      - { has: spindschluessel }
    do:
      - unlock: spind_jakob
      - open: spind_jakob
      - move: { object: spindschluessel, to: nowhere }
      - say: "Der Schlüssel dreht sich schwer, dann gibt das Bartschloss nach, und du lässt den Schlüssel stecken. Der Spind ist leer; die Polizei hat mitgenommen, was sie finden wollte. Innen an der Tür steht etwas, schabloniert, wie in jedem dieser Spinde: ›Zweitschlüssel beim Vorarbeiter‹. Und hinter der Rückwand klemmt ein {zigarettenpaeckchen}, das sie übersehen haben."
      - learn: clue_zweitschluessel
      - say: Ein zweiter Schlüssel also, und den hat der Vorarbeiter, Kröger, derselbe Mann, der am Freitag vor dem Kommissar aufgeschlossen hat. Jakobs eigener Schlüssel hing seit Donnerstagmittag zu Hause am Haken. Zwei Einträge in deinem Notizbuch, die zusammengehören.
      - score: 1

  - id: use_schluessel_glaskabine
    on: { verb: use, object: spindschluessel, with: glaskabine }
    do:
      - say: Zu klein. Der gehört zu einem Spind, nicht zu einem Glaskasten.

  - id: close_spind
    on: { verb: close, object: spind_jakob }
    do:
      - say: Du lässt ihn offen. Jakob hat nichts zu verbergen.

  - id: pull_spind
    on: { verb: pull, object: spind_jakob }
    do:
      - say: Festgeschraubt. Und laut wäre es auch.

  - id: take_spindreihe
    on: { verb: take, object: spindreihe }
    do:
      - say: Zwanzig Blechspinde. Du hast zwei Hände.

  - id: take_paeckchen
    on: { verb: take, object: zigarettenpaeckchen }
    when: { not: { has: zigarettenpaeckchen } }
    do:
      - move: { object: zigarettenpaeckchen, to: inventory }
      - say:
          - when: { has: clue_loeschliste }
            text: "Du ziehst das Päckchen hinter der Rückwand hervor. Auf der Banderole steht ›NAAFI – LOT 4471‹. Das weißt du noch aus der Versicherung: Die NAAFI vergibt Losnummern pro Lieferung, ein Los, ein Schiff. Welches Schiff, steht auf der Ladeliste am Tor."
          - text: "Du ziehst das Päckchen hinter der Rückwand hervor. Auf der Banderole steht ›NAAFI – LOT 4471‹. Das weißt du noch aus der Versicherung: Die NAAFI vergibt Losnummern pro Lieferung, ein Los, ein Schiff. Mit der Nummer lässt sich herausfinden, wann diese Zigaretten an Land kamen."
      - learn: clue_los4471

  # -------------------------------------------------------------------------
  # P2: Der Tallyzettel. Taking the clipboard while holding the hook fishes
  # for it as well (»hol das Klemmbrett«).
  # -------------------------------------------------------------------------
  - id: take_bootshaken
    on: { verb: take, object: bootshaken }
    when: { not: { has: bootshaken } }
    do:
      - move: { object: bootshaken, to: inventory }
      - say:
          - when: { flag: kennt_tadeusz }
            text: "»Nehmen Sie«, sagt Tadeusz, ohne aufzusehen. »Er gehört mir sowieso nicht. Hier gehört mir gar nichts.«"
          - text: "»Nehmen Sie«, sagt der Wächter, ohne aufzusehen. »Er gehört mir sowieso nicht. Hier gehört mir gar nichts.«"

  - id: angeln_klemmbrett
    on: { verb: use, object: bootshaken, with: klemmbrett }
    when: { not: { has: clue_tally } }
    do:
      - say:
          - when: { flag: kennt_tadeusz }
            text: |-
              Du schiebst den Bootshaken durch den Spalt und angelst nach dem Nagel. Zweimal rutscht das Brett ab, beim dritten Mal kommt es mit, und du hältst den Zählzettel der Donnerstagnacht in der Hand: ›Elspeth Gray, Do. Nachtschicht: 180 Kisten. W. Kröger, i. V. Kontrollzähler.‹

              Kröger hat also selbst gezählt, ausgerechnet in dieser Nacht, in Vertretung des Kontrollzählers. Du schreibst die Zahl ab und hängst das Brett zurück. Dabei rutscht dir der Haken aus der Hand und poltert in die Kabine. Er gehörte Tadeusz ja sowieso nicht.
          - text: |-
              Du schiebst den Bootshaken durch den Spalt und angelst nach dem Nagel. Zweimal rutscht das Brett ab, beim dritten Mal kommt es mit, und du hältst den Zählzettel der Donnerstagnacht in der Hand: ›Elspeth Gray, Do. Nachtschicht: 180 Kisten. W. Kröger, i. V. Kontrollzähler.‹

              Kröger hat also selbst gezählt, ausgerechnet in dieser Nacht, in Vertretung des Kontrollzählers. Du schreibst die Zahl ab und hängst das Brett zurück. Dabei rutscht dir der Haken aus der Hand und poltert in die Kabine. Er gehörte dem Wächter ja sowieso nicht.
      - move: { object: bootshaken, to: nowhere }
      - learn: clue_tally
      - score: 1

  - id: angeln_glaskabine
    on: { verb: use, object: bootshaken, with: glaskabine }
    when: { not: { has: clue_tally } }
    do:
      - say:
          - when: { flag: kennt_tadeusz }
            text: |-
              Du schiebst den Bootshaken durch den Spalt und angelst nach dem Nagel. Zweimal rutscht das Brett ab, beim dritten Mal kommt es mit, und du hältst den Zählzettel der Donnerstagnacht in der Hand: ›Elspeth Gray, Do. Nachtschicht: 180 Kisten. W. Kröger, i. V. Kontrollzähler.‹

              Kröger hat also selbst gezählt, ausgerechnet in dieser Nacht, in Vertretung des Kontrollzählers. Du schreibst die Zahl ab und hängst das Brett zurück. Dabei rutscht dir der Haken aus der Hand und poltert in die Kabine. Er gehörte Tadeusz ja sowieso nicht.
          - text: |-
              Du schiebst den Bootshaken durch den Spalt und angelst nach dem Nagel. Zweimal rutscht das Brett ab, beim dritten Mal kommt es mit, und du hältst den Zählzettel der Donnerstagnacht in der Hand: ›Elspeth Gray, Do. Nachtschicht: 180 Kisten. W. Kröger, i. V. Kontrollzähler.‹

              Kröger hat also selbst gezählt, ausgerechnet in dieser Nacht, in Vertretung des Kontrollzählers. Du schreibst die Zahl ab und hängst das Brett zurück. Dabei rutscht dir der Haken aus der Hand und poltert in die Kabine. Er gehörte dem Wächter ja sowieso nicht.
      - move: { object: bootshaken, to: nowhere }
      - learn: clue_tally
      - score: 1

  - id: take_klemmbrett_fertig
    on: { verb: take, object: klemmbrett }
    when: { has: clue_tally }
    do:
      - say: Was draufsteht, hast du im Notizbuch. Das Brett soll hängen, wo Kröger es sucht.

  - id: take_klemmbrett_haken
    on: { verb: take, object: klemmbrett }
    when: { has: bootshaken }
    do:
      - say:
          - when: { flag: kennt_tadeusz }
            text: |-
              Du schiebst den Bootshaken durch den Spalt und angelst nach dem Nagel. Zweimal rutscht das Brett ab, beim dritten Mal kommt es mit, und du hältst den Zählzettel der Donnerstagnacht in der Hand: ›Elspeth Gray, Do. Nachtschicht: 180 Kisten. W. Kröger, i. V. Kontrollzähler.‹

              Kröger hat also selbst gezählt, ausgerechnet in dieser Nacht, in Vertretung des Kontrollzählers. Du schreibst die Zahl ab und hängst das Brett zurück. Dabei rutscht dir der Haken aus der Hand und poltert in die Kabine. Er gehörte Tadeusz ja sowieso nicht.
          - text: |-
              Du schiebst den Bootshaken durch den Spalt und angelst nach dem Nagel. Zweimal rutscht das Brett ab, beim dritten Mal kommt es mit, und du hältst den Zählzettel der Donnerstagnacht in der Hand: ›Elspeth Gray, Do. Nachtschicht: 180 Kisten. W. Kröger, i. V. Kontrollzähler.‹

              Kröger hat also selbst gezählt, ausgerechnet in dieser Nacht, in Vertretung des Kontrollzählers. Du schreibst die Zahl ab und hängst das Brett zurück. Dabei rutscht dir der Haken aus der Hand und poltert in die Kabine. Er gehörte dem Wächter ja sowieso nicht.
      - move: { object: bootshaken, to: nowhere }
      - learn: clue_tally
      - score: 1

  - id: take_klemmbrett
    on: { verb: take, object: klemmbrett }
    do:
      - say: Dein Arm reicht nicht bis an den Nagel. Du bräuchtest etwas Langes mit einem Haken.

  - id: take_glaskabine_haken
    on: { verb: take, object: glaskabine }
    when: { has: clue_tally }
    do:
      - say: Der Bootshaken liegt hinter Glas und Vorhängeschloss. Dort bleibt er bis Montag.

  - id: open_glaskabine
    on: { verb: open, object: glaskabine }
    do:
      - say: Abgeschlossen. Der Schuppenmeister ist bis Montag bei seiner Schwester in Harburg.

  - id: push_glaskabine
    on: { verb: push, object: glaskabine }
    do:
      - say: Glas einschlagen, im Hafen, am Sonnabend? Dann steht morgen dein Name in der Zeitung, nicht Krögers.

  - id: use_streichhoelzer_klemmbrett
    on: { verb: use, object: streichhoelzer, with: klemmbrett }
    do:
      - say: Beweise verbrennt man nicht. Das machen andere.

  # -------------------------------------------------------------------------
  # Deductions D1–D6 (use clue clue; the engine also tries the swapped order).
  # Equivalent pairs that carry the same facts are accepted too: Jakob's
  # count for the Löschliste (D1), the pack itself for its lot number (D2),
  # the note on the floor for its copy (D6).
  # -------------------------------------------------------------------------
  - id: d1_zwanzig_kisten
    on: { verb: use, object: clue_tally, with: clue_loeschliste }
    when: { not: { has: clue_zwanzig_kisten } }
    do:
      - say: Du legst die beiden Zahlen nebeneinander. Laut Ladeliste sollten zweihundert Kisten an Land, Kröger hat hundertachtzig in den Schuppen gezählt. Zwanzig Kisten haben sich zwischen Schiff und Schuppen in Luft aufgelöst, in einer Nacht, in der ausgerechnet der Vorarbeiter selbst die Zählung gemacht hat. Kröger nennt das Schwund. Aber Schwund verkauft man nicht, und irgendwer verdient an zwanzig Kisten Zigaretten.
      - learn: clue_zwanzig_kisten
      - score: 1

  - id: d1_schon
    on: { verb: use, object: clue_tally, with: clue_loeschliste }
    do:
      - say: "Schon notiert: {clue_zwanzig_kisten}."

  - id: d1_zwanzig_kisten_heft
    on: { verb: use, object: clue_tally, with: clue_zaehlheft }
    when: { not: { has: clue_zwanzig_kisten } }
    do:
      - say: Jakob hat zweihundert Kisten am Kran gezählt, Kröger hundertachtzig Kisten. Zwanzig Kisten haben sich zwischen Schiff und Schuppen in Luft aufgelöst, in einer Nacht, in der ausgerechnet der Vorarbeiter selbst die Zählung gemacht hat. Kröger nennt das Schwund. Aber irgendwer verdient an zwanzig Kisten Zigaretten.
      - learn: clue_zwanzig_kisten
      - score: 1

  - id: d1_heft_schon
    on: { verb: use, object: clue_tally, with: clue_zaehlheft }
    do:
      - say: "Schon notiert: {clue_zwanzig_kisten}."

  - id: d2_frisch_an_land
    on: { verb: use, object: clue_los4471, with: clue_loeschliste }
    when: { not: { has: clue_frisch_an_land } }
    do:
      - say: "Los 4471, das ist die Ladung der »Elspeth Gray«, entladen in der Donnerstagnacht. Was in Jakobs Spind lag, war am Donnerstagmittag also noch auf See. Wer es hineingelegt hat, hat das frühestens in der Nacht getan, in der Jakob verschwand."
      - learn: clue_frisch_an_land
      - score: 1

  - id: d2_schon
    on: { verb: use, object: clue_los4471, with: clue_loeschliste }
    do:
      - say: "Schon notiert: {clue_frisch_an_land}."

  - id: d2_frisch_an_land_paeckchen
    on: { verb: use, object: zigarettenpaeckchen, with: clue_loeschliste }
    when: { not: { has: clue_frisch_an_land } }
    do:
      - say: "Los 4471, das ist die Ladung der »Elspeth Gray«, entladen in der Donnerstagnacht. Was in Jakobs Spind lag, war am Donnerstagmittag also noch auf See. Wer es hineingelegt hat, hat das frühestens in der Nacht getan, in der Jakob verschwand."
      - learn: clue_frisch_an_land
      - score: 1

  - id: d2_paeckchen_schon
    on: { verb: use, object: zigarettenpaeckchen, with: clue_loeschliste }
    do:
      - say: "Schon notiert: {clue_frisch_an_land}."

  - id: d3_nur_kroeger
    on: { verb: use, object: clue_schluessel, with: clue_zweitschluessel }
    when: { not: { has: clue_nur_kroeger } }
    do:
      - say: Du gehst es durch, wie du früher einen Schaden durchgegangen bist, der zu glatt aussah. Jakobs Schlüssel hängt seit Donnerstagmittag zu Hause am Haken. Den zweiten hat der Vorarbeiter. Ein Bartschloss geht nicht ohne Schlüssel auf und nicht ohne Schlüssel wieder zu. Seit Donnerstagmittag hatte also nur ein Mann Zugang zu Spind 23, und das ist Kröger.
      - learn: clue_nur_kroeger
      - score: 1

  - id: d3_schon
    on: { verb: use, object: clue_schluessel, with: clue_zweitschluessel }
    do:
      - say: "Schon notiert: {clue_nur_kroeger}."

  - id: d4_untergeschoben
    on: { verb: use, object: clue_frisch_an_land, with: clue_nur_kroeger }
    when: { not: { has: clue_untergeschoben } }
    do:
      - say: |-
          Jetzt passt es zusammen. Die Ware kam in der Donnerstagnacht an Land, und zu diesem Zeitpunkt konnte Jakob seit Stunden nicht mehr an seinen Spind. Kröger schon. Jakob hat diese Zigaretten nicht gestohlen. Jemand hat sie ihm hineingelegt und am Freitagmorgen dafür gesorgt, dass der Kommissar sie findet.

          Das ändert den Fall. Wer einen Mann zum Dieb macht, will, dass niemand nach ihm sucht. Jakob ist nicht weggelaufen; irgendwer will, dass er wegbleibt. Und Tadeusz, sein Freund am Zollkanal, wird nur mit dir reden, wenn du das beweisen kannst.
      - learn: clue_untergeschoben
      - score: 2

  - id: d4_schon
    on: { verb: use, object: clue_frisch_an_land, with: clue_nur_kroeger }
    do:
      - say: "Schon notiert: {clue_untergeschoben}."

  - id: d5_kein_schwund
    on: { verb: use, object: clue_zwanzig_kisten, with: clue_lene }
    when: { not: { has: clue_kein_schwund } }
    do:
      - say: Zwanzig Kisten fehlen auf Krögers Zählung, und am Freitagmorgen verkauft Kröger genau dieses Los auf dem Schwarzmarkt. Das ist kein Schwund. Das ist ein Geschäft, und Kröger macht es nicht auf eigene Rechnung. Damit hält Krögers erste Behauptung nicht mehr.
      - learn: clue_kein_schwund
      - score: 1

  - id: d5_schon
    on: { verb: use, object: clue_zwanzig_kisten, with: clue_lene }
    do:
      - say: "Schon notiert: {clue_kein_schwund}."

  - id: d6_dieselbe_hand
    on: { verb: use, object: clue_anweisung, with: clue_persilschein }
    when: { not: { has: clue_dieselbe_hand } }
    do:
      - say: Grüne Tinte, steile Schrift, und jedes »g« hat dieselbe Schleife nach rechts, auf beiden Blättern. Der Mann, der Kröger im Mai mit einem Persilschein reingewaschen hat, hat auch die Anweisung geschrieben, Jakob ohne Licht hier oben liegen zu lassen. Das war Asmussen, und er sitzt ein paar Stockwerke tiefer bei seinem Kaffee.
      - learn: clue_dieselbe_hand
      - score: 2

  - id: d6_schon
    on: { verb: use, object: clue_anweisung, with: clue_persilschein }
    do:
      - say: "Schon notiert: {clue_dieselbe_hand}."

  - id: d6_dieselbe_hand_zettel
    on: { verb: use, object: zettel, with: clue_persilschein }
    when: { not: { has: clue_dieselbe_hand } }
    do:
      - say: Du legst den Persilschein neben den Zettel. Grüne Tinte, steile Schrift, und jedes »g« hat dieselbe Schleife nach rechts, auf beiden Blättern. Der Mann, der Kröger im Mai mit einem Persilschein reingewaschen hat, hat auch die Anweisung geschrieben, Jakob ohne Licht hier oben liegen zu lassen. Das war Asmussen, und er sitzt ein paar Stockwerke tiefer bei seinem Kaffee.
      - learn: clue_anweisung
      - learn: clue_dieselbe_hand
      - score: 2

  - id: d6_zettel_schon
    on: { verb: use, object: zettel, with: clue_persilschein }
    do:
      - say: "Schon notiert: {clue_dieselbe_hand}."

  # Near misses: plausible wrong pairs point to the missing piece.
  - id: nm_tally_los
    on: { verb: use, object: clue_tally, with: clue_los4471 }
    do:
      - say: Auf dem Zählzettel steht keine Losnummer. Aber irgendwo anders vielleicht.

  - id: nm_auftrag_zweitschluessel
    on: { verb: use, object: clue_auftrag, with: clue_zweitschluessel }
    do:
      - say: Ein Zweitschlüssel beim Vorarbeiter. Und wo war Jakobs eigener Schlüssel?

  - id: nm_frisch_zweitschluessel
    on: { verb: use, object: clue_frisch_an_land, with: clue_zweitschluessel }
    do:
      - say: Die Ware kam Donnerstagnacht, und der Vorarbeiter hat einen Zweitschlüssel. Aber Jakob hatte auch einen. Wo war der?

  - id: nm_frisch_schluessel
    on: { verb: use, object: clue_frisch_an_land, with: clue_schluessel }
    do:
      - say: Die Ware kam, als Jakobs Schlüssel längst zu Hause hing. Aber es gab noch einen zweiten.

  - id: nm_nur_kroeger_auftrag
    on: { verb: use, object: clue_nur_kroeger, with: clue_auftrag }
    do:
      - say: Seit Donnerstagmittag konnte nur Kröger an den Spind. Aber vorher Jakob. Wann kam die Ware an Land?

  - id: nm_nur_kroeger_los
    on: { verb: use, object: clue_nur_kroeger, with: clue_los4471 }
    do:
      - say: Seit Donnerstagmittag konnte nur Kröger an den Spind. Und wann kam dieses Los an Land?

  - id: nm_frisch_auftrag
    on: { verb: use, object: clue_frisch_an_land, with: clue_auftrag }
    do:
      - say: Die Ware kam Donnerstagnacht. Jakob war Donnerstagnacht an Bord. Hatte er seinen Schlüssel dabei?

  - id: nm_lene_tally
    on: { verb: use, object: clue_lene, with: clue_tally }
    do:
      - say: Kröger verkauft Los 4471. Aber fehlt überhaupt etwas? Erst gehört der Zählzettel neben die Ladeliste.

  - id: nm_zwanzig_zaehlheft
    on: { verb: use, object: clue_zwanzig_kisten, with: clue_zaehlheft }
    do:
      - say: Jakob kam auf dieselbe Rechnung wie du, zwanzig zu wenig. Aber dem Heft eines Verschwundenen glaubt keiner. Wer verdient an den zwanzig Kisten?

  - id: nm_anweisung_gestaendnis
    on: { verb: use, object: clue_anweisung, with: clue_gestaendnis }
    do:
      - say: Kröger hat gestanden, aber diese Anweisung ist an ihn gerichtet, nicht von ihm. Wessen grüne Tinte hast du heute noch gesehen?

  # Asmussen's card. The specific pairs name clue_asmussen as `object`, so
  # they are tried before the general reply in both orders.
  - id: nm_asmussen_schweigegeld
    on: { verb: use, object: clue_asmussen, with: clue_schweigegeld }
    do:
      - say:
          - when: { has: clue_gestaendnis }
            text: Asmussens Stempel auf Krögers Kuvert. Das Geld kam von oben. Aber ein Stempel beweist nicht, wer das Kuvert gefüllt hat.
          - text: Asmussens Stempel auf Krögers Kuvert. Das Geld kam von oben. Aber zuerst musst du Kröger damit festnageln.

  - id: nm_asmussen_anweisung
    on: { verb: use, object: clue_asmussen, with: clue_anweisung }
    do:
      - say: Asmussens Karte ist gedruckt. Du brauchst etwas, das er mit der Hand geschrieben hat.

  - id: nm_asmussen_lene
    on: { verb: use, object: clue_asmussen, with: clue_lene }
    do:
      - say: Ein Kaffeemann aus der Speicherstadt, ein Kaffee-Import in Speicher K. Das passt. Aber es ist Gerede aus zweiter Hand.

  - id: nm_asmussen_jakob
    on: { verb: use, object: clue_asmussen, with: clue_jakob_aussage }
    do:
      - say: Ein Kamelhaarmantel. Asmussen trug einen am Baumwall. Das wirst du ihm ins Gesicht sagen.

  - id: use_asmussen
    on: { verb: use, object: clue_asmussen }
    do:
      - say:
          - when: { has: clue_dieselbe_hand }
            text: Gegen Asmussen hast du genug. Den Rest sagst du ihm ins Gesicht.
          - when: { has: clue_gestaendnis }
            text: Asmussen steckt in allem drin. Gegen ihn brauchst du etwas, das er selbst geschrieben hat.
          - text: Asmussen steckt irgendwo mit drin. Aber zuerst musst du Kröger festnageln.

  # Kröger's claims are answered to his face, not in the notebook.
  - id: use_kroeger_version
    on: { verb: use, object: clue_kroeger_version }
